
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="fixed top-0 left-0 right-0 z-50 bg-background-50/95 backdrop-blur-md border-b border-background-200/50">
    <div class="w-full px-4 md:px-8 lg:px-12">
        <div class="flex items-center justify-between h-20 md:h-24">
            <a href="/" class="flex items-center gap-2">
                <span class="text-xl md:text-2xl font-semibold font-heading text-foreground-950 tracking-tight">Ounce</span>
            </a>

            <div class="hidden md:flex items-center gap-8">
                <a href="/" class="text-sm font-medium text-foreground-600 hover:text-foreground-950 transition-colors whitespace-nowrap tracking-wide">Ounce</a>
                <a href="/timedeal" class="text-sm font-medium text-foreground-600 hover:text-foreground-950 transition-colors whitespace-nowrap tracking-wide ready-btn">미드나이트</a>
                <a href="/products" class="text-sm font-medium text-foreground-600 hover:text-foreground-950 transition-colors whitespace-nowrap tracking-wide ready-btn">큐레이션</a>
                <a href="/products" class="text-sm font-medium text-foreground-600 hover:text-foreground-950 transition-colors whitespace-nowrap tracking-wide ready-btn">베스트</a>
            </div>

            <div class="flex items-center gap-3 md:gap-4">

                <!-- 로그인 상태에서만 -->
                <div class="relative" id="user-menu-wrap" sec:authorize="isAuthenticated()">
                    <button
                            id="user-menu-btn"
                            class="group flex items-center gap-1.5 text-sm font-medium text-foreground-700 hover:text-foreground-950 transition-colors cursor-pointer"
                    >
                        <!-- 이름 영역 -->
                        <span class="whitespace-nowrap" id="nav-user-name">사용자</span>
                        <span class="text-foreground-500">님</span>
                        <i class="ri-arrow-down-s-line text-sm text-foreground-400 group-hover:text-foreground-600 transition-transform duration-200 group-hover:translate-y-0.5"></i>
                    </button>
                    <div id="user-menu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white border border-background-200 rounded-xl shadow-lg overflow-hidden z-50 py-1">
                        <a href="/account" class="flex items-center gap-3 px-4 py-2.5 text-sm text-foreground-700 hover:bg-background-100 transition-colors">
                            <i class="ri-user-line text-foreground-400 text-base"></i> 내 계정
                        </a>
                        <a href="/orders" class="flex items-center gap-3 px-4 py-2.5 text-sm text-foreground-700 hover:bg-background-100 transition-colors ready-btn">
                            <i class="ri-file-list-3-line text-foreground-400 text-base"></i> 주문 내역
                        </a>
                        <hr class="my-1 border-background-200"/>
                        <button id="logoutBtn" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors text-left cursor-pointer">
                            <i class="ri-logout-box-r-line text-base"></i> 로그아웃
                        </button>
                    </div>
                </div>

                <!-- 비로그인 상태에서만 -->
                <a href="/login" id="login-btn-desktop" sec:authorize="!isAuthenticated()"
                   class="text-sm font-medium text-foreground-600 hover:text-foreground-950 transition-colors whitespace-nowrap tracking-wide">로그인</a>

                <a href="/cart" class="relative text-foreground-700 hover:text-primary-500 transition-colors">
                    <i class="ri-shopping-cart-2-line text-xl"></i>
                    <span class="cart-badge hidden absolute -top-1.5 -right-1.5 w-4 h-4 flex items-center justify-center bg-primary-500 text-white text-[10px] font-bold rounded-full">0</span>
                </a>
            </div>

            <button id="mobile-menu-btn" class="md:hidden w-10 h-10 flex items-center justify-center">
                <i class="ri-menu-line text-2xl text-foreground-950"></i>
            </button>
        </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-background-50/98 backdrop-blur-md border-t border-background-200 shadow-lg">
        <div class="px-4 py-5">

            <!-- 네비게이션 섹션 -->
            <p class="px-1 mb-2 text-[11px] font-semibold text-foreground-400 tracking-wider uppercase">둘러보기</p>
            <div class="grid grid-cols-2 gap-2 mb-5">
                <a href="/" class="flex items-center gap-2.5 px-3 py-3.5 text-sm font-medium text-foreground-700 bg-background-100/60 hover:bg-background-100 rounded-xl transition-colors">
                    <i class="ri-home-4-line text-primary-500 text-lg"></i> Ounce
                </a>
                <a href="/timedeal" class="flex items-center gap-2.5 px-3 py-3.5 text-sm font-medium text-foreground-700 bg-background-100/60 hover:bg-background-100 rounded-xl transition-colors ready-btn">
                    <i class="ri-moon-line text-primary-500 text-lg"></i> 미드나이트
                </a>
                <a href="/products" class="flex items-center gap-2.5 px-3 py-3.5 text-sm font-medium text-foreground-700 bg-background-100/60 hover:bg-background-100 rounded-xl transition-colors ready-btn">
                    <i class="ri-leaf-line text-primary-500 text-lg"></i> 큐레이션
                </a>
                <a href="/products" class="flex items-center gap-2.5 px-3 py-3.5 text-sm font-medium text-foreground-700 bg-background-100/60 hover:bg-background-100 rounded-xl transition-colors ready-btn">
                    <i class="ri-star-line text-primary-500 text-lg"></i> 베스트
                </a>
            </div>

            <!-- 계정 섹션 -->
            <p class="px-1 mb-2 text-[11px] font-semibold text-foreground-400 tracking-wider uppercase">내 계정</p>
            <div class="flex flex-col gap-0.5">
                <!-- 비로그인 -->
                <a href="/login" sec:authorize="!isAuthenticated()" class="flex items-center gap-3 px-3 py-3 text-sm font-medium text-foreground-700 hover:bg-background-100 rounded-xl transition-colors">
                    <i class="ri-login-box-line text-foreground-400 text-base"></i> 로그인
                </a>

                <!-- 로그인 -->
                <a href="/account" sec:authorize="isAuthenticated()" class="flex items-center gap-3 px-3 py-3 text-sm font-medium text-foreground-700 hover:bg-background-100 rounded-xl transition-colors">
                    <i class="ri-user-line text-foreground-400 text-base"></i> 내 계정
                </a>
                <a href="/orders" sec:authorize="isAuthenticated()" class="flex items-center gap-3 px-3 py-3 text-sm font-medium text-foreground-700 hover:bg-background-100 rounded-xl transition-colors ready-btn">
                    <i class="ri-file-list-3-line text-foreground-400 text-base"></i> 주문 내역
                </a>
                <button id="logout-btn-mobile" sec:authorize="isAuthenticated()" class="flex items-center gap-3 px-3 py-3 text-sm font-medium text-red-500 hover:bg-red-50 rounded-xl transition-colors text-left w-full">
                    <i class="ri-logout-box-r-line text-base"></i> 로그아웃
                </button>
            </div>

        </div>
    </div>

    <script th:inline="none">
        document.addEventListener('DOMContentLoaded', function () {
            // 모바일 메뉴 토글
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
            }

            // 유저 드롭다운 토글
            const userBtn = document.getElementById('user-menu-btn');
            const userMenu = document.getElementById('user-menu');
            if (userBtn && userMenu) {
                userBtn.addEventListener('click', () => userMenu.classList.toggle('hidden'));
                document.addEventListener('click', (e) => {
                    if (!userBtn.contains(e.target) && !userMenu.contains(e.target)) {
                        userMenu.classList.add('hidden');
                    }
                });
            }

            // 로그아웃 (서버에 요청 → 쿠키 만료)
            const handleLogout = async function(e) {
                e.preventDefault();
                try {
                    await fetch('/api/members/logout', { method: 'POST', credentials: 'include' });
                } catch (err) {
                    console.error("로그아웃 요청 실패:", err);
                }
                alert('로그아웃 되었습니다.');
                window.location.href = '/';
            };

            // navbar 스크립트 안, DOMContentLoaded 콜백에 추가
            fetch('/api/carts/me', { credentials: 'include' })
                .then(res => res.ok ? res.json() : null)
                .then(cart => {
                    if (!cart) return;  // 비로그인이면 패스

                    // 장바구니에 담긴 상품 종류 수 (또는 수량 합)
                    const count = cart.reduce((sum, item) => sum + item.quantity, 0);

                    document.querySelectorAll('.cart-badge').forEach(badge => {
                        if (count > 0) {
                            badge.textContent = count > 99 ? '99+' : count;
                            badge.classList.remove('hidden');
                        } else {
                            badge.classList.add('hidden');  // 0개면 배지 숨김
                        }
                    });
                })
                .catch(err => console.error('장바구니 개수 조회 실패:', err));

            // 로그인 상태면 이메일 @앞부분을 이름으로 채우기
            fetch('/api/members/me', { credentials: 'include' })
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (!data) return;  // 비로그인(401)이면 그냥 패스

                    const namePart = data.email.split('@')[0];  // chulsoo@gmail.com → chulsoo

                    // 이름 채우기
                    const nameEl = document.getElementById('nav-user-name');
                    if (nameEl) nameEl.textContent = namePart;

                    // 아바타 글자도 첫 글자로
                    const avatarEl = document.querySelector('#user-menu-btn .rounded-full');
                    if (avatarEl) avatarEl.textContent = namePart.charAt(0).toUpperCase();
                })
                .catch(err => console.error('유저 정보 조회 실패:', err));

            const logoutBtn = document.getElementById('logoutBtn');
            const logoutBtnMobile = document.getElementById('logout-btn-mobile');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
            if (logoutBtnMobile) logoutBtnMobile.addEventListener('click', handleLogout);
        });

        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.ready-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault(); // 404 페이지로 넘어가는 것을 차단!
                    alert("🚧 현재 22시 타임딜 대규모 트래픽 방어를 위해 '주문 및 결제 아키텍처'를 치열하게 튜닝 중입니다. 곧 정식 오픈됩니다!");
                });
            });
        });
    </script>

</nav>

</body>
</html>
