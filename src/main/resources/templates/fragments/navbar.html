            <div class="flex flex-col gap-0.5">

                <a href="/account" sec:authorize="isAuthenticated()" class="flex items-center gap-3 px-3 py-3 text-sm font-medium text-foreground-700 hover:bg-background-100 rounded-xl transition-colors">

                <a href="/orders" sec:authorize="isAuthenticated()" class="flex items-center gap-3 px-3 py-3 text-sm font-medium text-foreground-700 hover:bg-background-100 rounded-xl transition-colors">

    <script th:inline="none">

        window.updateCartBadge = function (count) {
            const $badge = document.getElementById('cart-badge');
            if (!$badge) return;
            const newText = count > 99 ? '99+' : count.toString();
            const isChanged = $badge.textContent !== newText;

            $badge.textContent = newText;
            $badge.classList.toggle('hidden', !count);

            if (isChanged && count > 0) {
                $badge.classList.add('scale-125');
                setTimeout(() => {
                    $badge.classList.remove('scale-125');
                }, 200);
            }
        };

        window.refreshCartBadge = async function () {
            try {
                const res = await fetch('/api/carts/items', { credentials: 'include' });
                if (!res.ok) return;
                const items = await res.json();
                window.updateCartBadge(items.reduce((sum, i) => sum + i.quantity, 0));
            } catch (e) {
                console.error('장바구니 개수 조회 실패:', e);
            }
        };


        document.addEventListener('DOMContentLoaded', window.refreshCartBadge);
        window.addEventListener('pageshow', e => { if (e.persisted) window.refreshCartBadge(); });
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.nav-link[data-nav]').forEach(link => {
                const isCurrent = window.location.pathname === link.dataset.nav
                    && link.getAttribute('href') === (window.location.pathname + window.location.search);
                if (isCurrent) {
                    link.classList.remove('text-foreground-600', 'text-indigo-600');
                    link.classList.add('text-foreground-950', 'font-bold');
                    link.setAttribute('aria-current', 'page');
                }
            });

            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
            }

            const userBtn = document.getElementById('user-menu-btn');
            const userMenu = document.getElementById('user-menu');
            if (userBtn && userMenu) {
                userBtn.addEventListener('click', () => userMenu.classList.toggle('hidden'));
                document.addEventListener('click', (e) => {
                    if (!userBtn.contains(e.target) && !userMenu.contains(e.target)) {
                        userMenu.classList.add('hidden');
                    }
                });
            }

            // 🛠️ 로그아웃 버그 픽스
            const handleLogout = async function(e) {
                e.preventDefault();
                try {
                    // API 호출 시도
                    const res = await fetch('/api/members/logout', { method: 'POST', credentials: 'include' });
                    // API가 없을 경우 Spring 기본 로그아웃 경로로 폴백
                    if (res.status === 404) {
                        await fetch('/logout', { method: 'POST' });
                    }
                } catch (err) {
                    console.error("로그아웃 요청 실패:", err);
                }

                // ui.toast가 없어서 에러나는 상황 방지
                try {
                    if (typeof ui !== 'undefined' && ui.toast) {
                        ui.toast('로그아웃 되었습니다.');
                    }
                } catch(e) {}

                // 대기 시간 없이 즉시 리다이렉트
                window.location.href = '/';
            };



            fetch('/api/members/me', { credentials: 'include' })
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (!data) return;
                    const namePart = data.email.split('@')[0];
                    const nameEl = document.getElementById('nav-user-name');
                    if (nameEl) nameEl.textContent = namePart;
                    const avatarEl = document.querySelector('#user-menu-btn .rounded-full');
                    if (avatarEl) avatarEl.textContent = namePart.charAt(0).toUpperCase();
                })
                .catch(err => console.error('유저 정보 조회 실패:', err));

            const logoutBtn = document.getElementById('logoutBtn');
            const logoutBtnMobile = document.getElementById('logout-btn-mobile');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
            if (logoutBtnMobile) logoutBtnMobile.addEventListener('click', handleLogout);

            const searchBtn = document.getElementById('search-btn');
            const searchOverlay = document.getElementById('search-overlay');
            const searchInput = document.getElementById('search-input');
            const searchClose = document.getElementById('search-close');
            const searchPanel = document.getElementById('search-panel');
            const searchBack = document.getElementById('search-back');

            function openSearch() {
                if (!searchOverlay) return;
                if (mobileMenu) mobileMenu.classList.add('hidden');
                searchOverlay.classList.remove('hidden');
                requestAnimationFrame(() => {
                    searchOverlay.classList.remove('opacity-0');
                    if (searchPanel) searchPanel.classList.remove('-translate-y-3');
                });
                setTimeout(() => searchInput && searchInput.focus(), 100);
            }
            function closeSearch() {
                if (!searchOverlay) return;
                searchOverlay.classList.add('opacity-0');
                if (searchPanel) searchPanel.classList.add('-translate-y-3');
                setTimeout(() => searchOverlay.classList.add('hidden'), 200);
            }

            if (searchBtn) searchBtn.addEventListener('click', openSearch);
            if (searchClose) searchClose.addEventListener('click', closeSearch);
            if (searchBack) searchBack.addEventListener('click', closeSearch);

            if (searchOverlay) {
                searchOverlay.addEventListener('click', (e) => {
                    if (e.target === searchOverlay) closeSearch();
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeSearch();
            });

            if (searchInput) {
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const q = searchInput.value.trim();
                        if (q) window.location.href = `/products?keyword=${encodeURIComponent(q)}`;
                    }
                });
            }
        });



        // document.getElementById('btn-cart').addEventListener('click', async () => {
        //     const ok = await addToCart();
        //     if (ok) {
        //         ui.toast('장바구니에 담았습니다.');
        //         await refreshCartBadge();
        //     }
        // });

    </script>
    <div id="search-overlay" class="hidden fixed top-20 md:top-24 left-0 right-0 bottom-0 z-40 bg-foreground-950/40 opacity-0 transition-opacity duration-200">
        <div class="w-full px-4 flex justify-center pt-6 md:pt-8">
            <div id="search-panel" class="w-full max-w-2xl -translate-y-3 transition-transform duration-200">
                <div class="flex items-center gap-3 bg-white rounded-2xl shadow-2xl ring-1 ring-background-200 px-5 py-4 focus-within:ring-2 focus-within:ring-primary-500/40 transition-all">
                    <button id="search-back" class="text-foreground-400 hover:text-foreground-700 transition-colors shrink-0" aria-label="뒤로">
                        <i class="ri-arrow-left-line text-xl"></i>
                    </button>
                    <input
                            id="search-input"

                            placeholder="밀키트를 검색해보세요"
                            class="flex-1 bg-transparent text-base text-foreground-950 placeholder-foreground-400 focus:outline-none"
                            autocomplete="off"
                    />
                    <button id="search-close" class="text-foreground-400 hover:text-foreground-700 transition-colors shrink-0 md:hidden" aria-label="닫기">
                        <i class="ri-close-line text-2xl"></i>
                    </button>
                </div>
                <div class="mt-3 bg-white/95 backdrop-blur rounded-2xl shadow-xl ring-1 ring-background-200 px-5 py-4">
                    <p class="text-[11px] font-semibold text-foreground-400 tracking-wider uppercase mb-3">추천 검색어</p>
                    <div class="flex flex-wrap gap-2">
                        <a href="/products?keyword=찌개" class="px-3 py-1.5 text-sm text-foreground-600 bg-background-100/70 hover:bg-primary-500 hover:text-white rounded-full transition-colors">찌개</a>
                        <a href="/products?keyword=파스타" class="px-3 py-1.5 text-sm text-foreground-600 bg-background-100/70 hover:bg-primary-500 hover:text-white rounded-full transition-colors">파스타</a>
                        <a href="/products?keyword=마라탕" class="px-3 py-1.5 text-sm text-foreground-600 bg-background-100/70 hover:bg-primary-500 hover:text-white rounded-full transition-colors">마라탕</a>
                        <a href="/products?keyword=밀키트" class="px-3 py-1.5 text-sm text-foreground-600 bg-background-100/70 hover:bg-primary-500 hover:text-white rounded-full transition-colors">밀키트</a>
                        <a href="/products?keyword=1인분" class="px-3 py-1.5 text-sm text-foreground-600 bg-background-100/70 hover:bg-primary-500 hover:text-white rounded-full transition-colors">1인분</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
