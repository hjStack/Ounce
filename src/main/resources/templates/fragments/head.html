<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: 'Ounce 🍊'">Ounce</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <!-- Pretendard: CSS 전반이 이 폰트를 지정하는데 정작 로드가 안 돼서 시스템 폰트로 떨어지고 있었음 -->
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PCJJBBGP');</script>
    <!-- End Google Tag Manager -->

    <link rel="icon" type="image/png" href="/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* Ounce 디자인 토큰 — 여기가 유일한 출처.
         * 이전에는 이 설정(오렌지 #ef8a25 / 앰버 #d97706)과 각 페이지에 하드코딩된
         * 테라코타 #d95d22 가 따로 굴러서 팔레트가 3개였음. 실제로 쓰이는 브랜드색인
         * 테라코타로 맞추고, primary 와 accent 를 같은 계열로 합침.
         * 또 foreground-900 / accent-200 처럼 템플릿이 쓰는데 정의가 없어서
         * 조용히 무시되던 shade 들을 전부 채웠음. */
        const OUNCE_BRAND = {
            50: '#fdf4f0', 100: '#fae3d8', 200: '#f5c7b2', 300: '#eda684', 400: '#e28152',
            500: '#d95d22', 600: '#bf4e1a', 700: '#9c3f15', 800: '#7d3312', 900: '#662b11'
        };
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Pacifico', 'cursive'],
                        sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        /* 텍스트/잉크 — 크림 배경과 맞물리게 warm neutral(stone) 계열 */
                        foreground: {
                            50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 300: '#d6d3d1',
                            400: '#a8a29e', 500: '#78716c', 600: '#57534e', 700: '#44403c',
                            800: '#292524', 900: '#1c1917', 950: '#0c0a09'
                        },
                        background: {
                            50: '#ffffff', 100: '#f7f6f4', 200: '#ebe9e5', 300: '#d9d6d0',
                            cream: '#fcfbf9'
                        },
                        /* 브랜드 테라코타 — primary 와 accent 를 같은 값으로 별칭 처리 */
                        primary: OUNCE_BRAND,
                        accent: OUNCE_BRAND,
                        /* 신선/배송 큐에만 아껴서 쓰는 허브 그린 */
                        secondary: {
                            100: '#dceee6', 200: '#bcdccd', 600: '#2f7a5f', 700: '#276650', 800: '#1f4e3d'
                        },
                        /* 어두운 CTA — products-detail 의 --btn-dark 와 동일 */
                        ink: { 500: '#2b2d3a', 600: '#1f2130' }
                    }
                }
            }
        }
    </script>
    <style>
        html { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
        /* 상품명·설명 1~2줄 자르기 (Tailwind CDN 에 line-clamp 플러그인이 없음) */
        .clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body></body>
</html>
