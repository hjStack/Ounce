<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: 'Ounce 🍊'">Ounce</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <!-- Pretendard: CSS 전반이 이 폰트를 지정하는데 정작 로드가 안 돼서 시스템 폰트로 떨어지고 있었음 -->
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PCJJBBGP');</script>
    <!-- End Google Tag Manager -->

    <link rel="icon" type="image/png" href="/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* Ounce 디자인 토큰 — 여기가 유일한 출처.
         *
         * 색 구성의 이유:
         * 상품 사진이 거의 다 붉은 국물(찌개·전골·떡볶이)이라 강조색까지 주황이면
         * 사진과 같은 계열로 부딪혀서 음식이 안 살고, 페이지 전체가 주황이라
         * 정작 '미드나이트 세일'이 눈에 안 들어왔다. 그래서 둘로 나눴다:
         *
         *   GREEN (primary / accent / secondary)  기본 강조. 붉은 음식과 보색이라
         *                                          사진이 돋보이고 '신선'과도 맞음.
         *   DEAL  (deal)                           세일·핫딜 전용. 여기만 주황을 쓰니
         *                                          세일이 실제로 튄다.
         *
         * primary·accent·secondary 를 같은 초록으로 별칭 처리한 이유: 기존 템플릿들이
         * 이 세 토큰을 일반 강조 용도로 뒤섞어 쓰고 있어서(mypage 23곳, orders 5곳 등),
         * 하나로 묶으면 손대지 않은 페이지들도 자동으로 같은 초록으로 정렬된다.
         *
         * 아울러 foreground-900 / accent-200 처럼 템플릿이 쓰는데 정의가 없어
         * 조용히 무시되던 shade 들을 전부 채웠다. */
        const GREEN = {
            50: '#f1f7f4', 100: '#dceee6', 200: '#bcdccd', 300: '#8fc3ab', 400: '#5aa285',
            500: '#2f7a5f', 600: '#276650', 700: '#205340', 800: '#1a4334', 900: '#143328'
        };
        const DEAL = {
            50: '#fdf4f0', 100: '#fae3d8', 200: '#f5c7b2', 300: '#eda684', 400: '#e28152',
            500: '#d95d22', 600: '#bf4e1a', 700: '#9c3f15', 800: '#7d3312', 900: '#662b11'
        };
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Pacifico', 'cursive'],
                        sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        /* 텍스트/잉크 — 크림 배경과 맞물리게 warm neutral(stone) 계열 */
                        foreground: {
                            50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 300: '#d6d3d1',
                            400: '#a8a29e', 500: '#78716c', 600: '#57534e', 700: '#44403c',
                            800: '#292524', 900: '#1c1917', 950: '#0c0a09'
                        },
                        background: {
                            50: '#ffffff', 100: '#f7f6f4', 200: '#ebe9e5', 300: '#d9d6d0',
                            cream: '#fcfbf9'
                        },
                        /* 기본 강조 — 세 토큰 모두 같은 허브 그린 */
                        primary: GREEN,
                        accent: GREEN,
                        secondary: GREEN,
                        /* 세일·핫딜 전용 테라코타. 미드나이트 세일 관련 요소에만 쓴다. */
                        deal: DEAL,
                        /* 어두운 CTA — products-detail 의 --btn-dark 와 동일 */
                        ink: { 500: '#2b2d3a', 600: '#1f2130' }
                    }
                }
            }
        }
    </script>
    <style>
        html { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
        /* 상품명·설명 1~2줄 자르기 (Tailwind CDN 에 line-clamp 플러그인이 없음) */
        .clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body></body>
</html>
