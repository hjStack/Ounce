
<footer th:fragment="footer" class="w-full bg-foreground-950">
    <!-- Upper Section -->
    <div class="w-full px-4 md:px-8 lg:px-12 py-8 md:py-10 max-w-7xl mx-auto">

        <div class="flex items-center justify-between mb-8">
            <h3 class="text-white text-2xl md:text-3xl font-semibold font-heading italic">Ounce</h3>

            <div class="flex items-center gap-4">

                <!-- AddToAny 공유 버튼 (인스타 로고 왼쪽 배치) -->
                <div class="a2a_kit a2a_kit_size_32 a2a_default_style flex items-center">
                    <a class="a2a_dd" href="https://www.addtoany.com/share"></a>
                    <a class="a2a_button_kakaotalk"></a>
                    <a class="a2a_button_sms"></a>
                    <a class="a2a_button_copy_link"></a>
                </div>

                <!-- 인스타그램 로고 및 텍스트 -->
                <a href="https://www.instagram.com/ounce__shop" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center justify-center w-11 h-11 rounded-lg border border-white/10 text-white/60 hover:text-white hover:border-white/30 transition-colors">
                    <i class="ri-instagram-line text-xl"></i>
                </a>

                <div>
                    <p class="text-white/70 text-sm font-medium">@ounce__shop</p>
                    <p class="text-white/40 text-xs">매일의 큐레이션을 만나보세요</p>
                </div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row lg:justify-between gap-6 lg:gap-16">
            <!-- Left: Brand description -->
            <div class="lg:max-w-sm">
                <p class="text-white/50 text-sm leading-relaxed mb-4">
                    당신의 아침을 디자인합니다.<br/>
                    매일 새벽, 신선한 감각을 배송합니다.
                </p>

                <div class="flex items-center gap-3">
                    <span class="text-accent-500 text-xs">●</span>
                    <span class="text-white/40 text-xs">매일 밤 10시, 미드나이트 세일 오픈</span>
                </div>
            </div>

            <!-- Right: Navigation Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
                <div th:each="section : ${footerLinks}">
                    <h4 class="text-white/80 font-medium text-xs uppercase tracking-wider mb-4" th:text="${section.title}"></h4>
                    <ul class="flex flex-col gap-2">
                        <li th:each="link : ${section.links}">
                            <a href="#" class="text-white/40 hover:text-white/70 text-sm transition-colors" th:text="${link}"></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Section -->
    <div class="border-t border-white/10">
        <div class="w-full px-4 md:px-8 lg:px-12 py-4 max-w-7xl mx-auto">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                <p class="text-white/30 text-xs">&copy; 2026 Ounce. All rights reserved.</p>
                <a href="#" class="text-white/30 hover:text-white/50 text-xs transition-colors">개인정보처리방침</a>
            </div>
        </div>
    </div>
</footer>
