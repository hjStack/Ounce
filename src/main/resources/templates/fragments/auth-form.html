<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="authForm(mode)" class="w-full max-w-md">

    <div th:replace="~{fragments/toast :: toast(${toastMessage}, ${toastType})}"></div>

    <div class="bg-background-50 rounded-xl border border-background-200/70 p-6 md:p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold font-heading text-foreground-950"
                th:text="${mode == 'login'} ? '로그인' : '회원가입'">로그인</h2>
            <p class="text-sm text-foreground-500 mt-1"
               th:text="${mode == 'login'} ? 'Ounce에 오신 것을 환영합니다' : 'Ounce의 회원이 되어 특별한 혜택을 받아보세요'">설명</p>
        </div>

        <form th:action="${mode == 'login'} ? @{/login} : @{/signup}" method="post" class="space-y-4">

            <div th:if="${mode != 'login'}">
                <label class="block text-sm font-medium text-foreground-700 mb-1.5">이름</label>
                <input type="text" name="name" placeholder="이름을 입력하세요"
                       class="w-full px-4 py-3 rounded-md border border-background-300/60 text-sm text-foreground-950 placeholder:text-foreground-400 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-background-50"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-foreground-700 mb-1.5">이메일</label>
                <input type="email" name="email" placeholder="example@email.com" required
                       class="w-full px-4 py-3 rounded-md border border-background-300/60 text-sm text-foreground-950 placeholder:text-foreground-400 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-background-50"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-foreground-700 mb-1.5">비밀번호</label>
                <input type="password" name="password" placeholder="8자 이상 입력하세요" minlength="8" required
                       class="w-full px-4 py-3 rounded-md border border-background-300/60 text-sm text-foreground-950 placeholder:text-foreground-400 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-background-50"/>
            </div>

            <div th:if="${mode != 'login'}">
                <label class="block text-sm font-medium text-foreground-700 mb-1.5">비밀번호 확인</label>
                <input type="password" name="confirmPassword" placeholder="비밀번호를 다시 입력하세요" minlength="8" required
                       class="w-full px-4 py-3 rounded-md border border-background-300/60 text-sm text-foreground-950 placeholder:text-foreground-400 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-background-50"/>
            </div>

            <button type="submit"
                    class="w-full py-3 bg-primary-500 text-white text-sm font-semibold rounded-md hover:bg-primary-600 transition-colors cursor-pointer"
                    th:text="${mode == 'login'} ? '로그인' : '회원가입'">로그인</button>
        </form>

        <div class="flex items-center gap-3 my-6">
            <div class="flex-1 h-px bg-background-300/60"></div>
            <span class="text-xs text-foreground-400">또는</span>
            <div class="flex-1 h-px bg-background-300/60"></div>
        </div>

        <div class="space-y-2.5">
            <button class="w-full flex items-center justify-center gap-2 py-3 bg-white border border-background-300/60 rounded-md text-sm text-foreground-700 hover:bg-background-100 transition-colors cursor-pointer">
                <i class="ri-google-fill text-lg"></i> Google로 계속하기
            </button>
            <button class="w-full flex items-center justify-center gap-2 py-3 bg-[#FEE500] rounded-md text-sm text-foreground-950 hover:bg-[#FDD800] transition-colors cursor-pointer">
                <i class="ri-kakao-talk-fill text-lg"></i> 카카오로 계속하기
            </button>
            <button class="w-full flex items-center justify-center gap-2 py-3 bg-[#03C75A] rounded-md text-sm text-white hover:bg-[#02B350] transition-colors cursor-pointer">
                <i class="ri-n-box-fill text-lg"></i> 네이버로 계속하기
            </button>
        </div>

        <div class="mt-6 text-center">
            <p class="text-sm text-foreground-500" th:if="${mode == 'login'}">
                아직 계정이 없으신가요?
                <a href="/signup" class="text-primary-500 font-semibold hover:text-primary-600 transition-colors">회원가입</a>
            </p>
            <p class="text-sm text-foreground-500" th:unless="${mode == 'login'}">
                이미 계정이 있으신가요?
                <a href="/login" class="text-primary-500 font-semibold hover:text-primary-600 transition-colors">로그인</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
