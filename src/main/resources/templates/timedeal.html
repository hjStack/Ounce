<!DOCTYPE html>
<html lang="ko">
<head th:replace="~{fragments/head :: head(title='미드나이트 - Ounce')}">

    <link rel="icon" type="image/png" href="/favicon.png?v=2">
</head>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timedeal</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    background: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1' },
                    foreground: { 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 950: '#020617' },
                    primary: { 100: '#dbeafe', 200: '#bfdbfe', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                    secondary: { 100: '#d1fae5', 200: '#a7f3d0', 600: '#059669', 700: '#047857' },
                    accent: { 100: '#fee2e2', 200: '#fecaca', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' }
                },
                fontFamily: {
                    sans: ['Pacifico', 'sans-serif'],
                    heading: ['Pacifico', 'sans-serif'], // 폰트 설정 예시
                }
            }
        }
    }
</script>

<body class="bg-foreground-950 text-white font-sans min-h-screen">

<!--<div th:replace="~{fragments/toast :: toast(${toastMessage}, ${toastType})}"></div>-->

<main class="pt-10">
    <!-- Hero Banner -->
    <div class="relative w-full h-[420px] overflow-hidden bg-foreground-900 flex flex-col items-center justify-center text-center px-4">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="absolute inset-0 bg-gradient-to-b from-foreground-950/70 to-foreground-950/90 z-0"></div>

        <div class="relative z-10">
            <h1 class="text-4xl md:text-6xl font-semibold mb-3">Midnight <span class="italic font-normal">Sale</span></h1>
            <p class="text-white/60 mb-8">매일 저녁 10시~11시, 선착순 한정 수량</p>

            <!-- 타이머 영역 (JS로 조작될 DOM) -->
            <div class="flex items-center gap-4 md:gap-6 justify-center">
                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 flex items-center justify-center bg-white/5 border border-white/10 rounded-sm">
                        <span id="timer-hours" class="text-2xl font-semibold">00</span>
                    </div>
                    <span class="text-xs text-white/40 mt-2">시간</span>
                </div>
                <span class="text-2xl font-light text-white/20">:</span>
                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 flex items-center justify-center bg-white/5 border border-white/10 rounded-sm">
                        <span id="timer-minutes" class="text-2xl font-semibold">00</span>
                    </div>
                    <span class="text-xs text-white/40 mt-2">분</span>
                </div>
                <span class="text-2xl font-light text-white/20">:</span>
                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 flex items-center justify-center bg-white/5 border border-white/10 rounded-sm">
                        <span id="timer-seconds" class="text-2xl font-semibold text-accent-400">00</span>
                    </div>
                    <span class="text-xs text-white/40 mt-2">초</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sorting & Grid Area -->
    <div class="px-4 md:px-8 lg:px-12 py-8">
        <div class="flex items-center gap-2 mb-6" id="sort-buttons">
            <span class="text-sm text-white/40 mr-2">정렬:</span>
            <!-- JS 이벤트 위임을 위해 컨테이너에 id 부여 -->
            <button data-sort="popular" class="sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-accent-500 text-white cursor-pointer">인기순</button>
            <button data-sort="discount" class="sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-white/5 text-white/50 hover:bg-white/10 cursor-pointer">할인율순</button>
            <button data-sort="price" class="sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-white/5 text-white/50 hover:bg-white/10 cursor-pointer">낮은 가격순</button>
        </div>

        <!-- 상품 카드들이 렌더링될 타겟 DOM -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- JS가 여기에 카드를 삽입합니다 -->
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>


<script>

    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    foreground: {
                        400: '#9ca3af', 500: '#6b7280', 600: '#4b5563',
                        700: '#374151', 800: '#1f2937', 900: '#111827', 950: '#030712'
                    },
                    background: { 50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb' },
                    primary:    { 400: '#ffffff', 500: '#ffffff' }, // ← 실제 브랜드 메인 컬러로 교체
                    accent:     { 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' }
                }
            }
        }
    }

    // // 1. Mock Data (React의 productsData.ts 대체)
    // const mockProducts = [
    //     { id: 1, name: '프리미엄 한돈 삼겹살 500g', originalPrice: 20000, discountPrice: 9900, discountPercent: 50, sold: 85, total: 100, unit: '100g 당 1,980원', image: 'https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=400&q=80' },
    //     { id: 2, name: '유기농 제주 감귤 3kg', originalPrice: 15000, discountPrice: 8900, discountPercent: 40, sold: 95, total: 100, unit: '100g 당 296원', image: 'https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5b?w=400&q=80' },
    //     { id: 3, name: '노르웨이 생연어 300g', originalPrice: 18000, discountPrice: 12000, discountPercent: 33, sold: 100, total: 100, unit: '100g 당 4,000원', image: 'https://images.unsplash.com/photo-1599084993091-1cb5c0721cc6?w=400&q=80' }
    // ];

    let currentSort = 'popular';

    // 2. DOM 요소 렌더링 함수 (React 컴포넌트 렌더링 대체)
    function renderProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = ''; // 기존 내용 초기화 (Re-rendering)

        // 정렬 로직
        const sorted = [...mockProducts].sort((a, b) => {
            if (currentSort === 'discount') return b.discountPercent - a.discountPercent;
            if (currentSort === 'price') return a.discountPrice - b.discountPrice;
            return b.sold - a.sold;
        });

        // 템플릿 리터럴로 HTML 문자열 생성 및 삽입
        sorted.forEach((product, index) => {
            const isSoldOut = product.sold >= product.total;
            const progress = Math.min((product.sold / product.total) * 100, 100);

            const cardHTML = `
          <div class="bg-foreground-900/40 rounded-lg overflow-hidden border border-white/5 relative cursor-pointer hover:border-accent-400/30 transition-all">
            <div class="relative w-full aspect-square bg-foreground-800 overflow-hidden">
              <img src="${product.image}" class="w-full h-full object-cover">
              ${isSoldOut ? `<div class="absolute inset-0 bg-foreground-950/70 flex items-center justify-center"><span class="px-5 py-2.5 bg-foreground-800 font-bold rounded-md">품절</span></div>` : ''}
            </div>
            <div class="p-4">
              <h3 class="text-sm font-medium line-clamp-2">${product.name}</h3>
              <div class="mt-2 flex gap-2 items-end">
                <span class="text-xl font-bold text-accent-400">${product.discountPrice.toLocaleString()}원</span>
                <span class="text-sm text-white/40 line-through">${product.originalPrice.toLocaleString()}원</span>
              </div>

              <!-- Progress Bar -->
              <div class="mt-3">
                <div class="flex justify-between text-xs mb-1.5">
                  <span class="text-primary-400">${isSoldOut ? '판매 완료' : `재고 ${product.total - product.sold}개 남음`}</span>
                  <span class="text-white/40">${product.sold}/${product.total}</span>
                </div>
                <div class="w-full h-2 bg-white/10 rounded-full">
                  <div class="h-full bg-accent-500 rounded-full transition-all" style="width: ${progress}%"></div>
                </div>
              </div>

              <button class="w-full mt-3 py-2.5 rounded-md text-sm font-semibold ${isSoldOut ? 'bg-white/5 text-white/30 cursor-not-allowed' : 'bg-accent-500 hover:bg-accent-400'}" ${isSoldOut ? 'disabled' : ''} onclick="alert('${product.id}번 상품 구매 진행')">
                ${isSoldOut ? '품절' : '바로 구매'}
              </button>
            </div>
          </div>
        `;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });
    }

    // 3. 정렬 탭 이벤트 리스너 부착 (이벤트 위임 활용)
    document.getElementById('sort-buttons').addEventListener('click', (e) => {
        if(e.target.classList.contains('sort-btn')) {
            // 기존 활성화 버튼 스타일 초기화
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.className = 'sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-white/5 text-white/50 hover:bg-white/10 cursor-pointer';
            });
            // 클릭된 버튼 스타일 변경
            e.target.className = 'sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-accent-500 text-white cursor-pointer';

            currentSort = e.target.dataset.sort;
            renderProducts(); // 상태 변경 후 다시 렌더링
        }
    });

    // 4. 타이머 로직 (React의 useEffect 대체)
    function updateTimer(){
        const now = new Date();
        const target = new Date();
        target.setHours(22, 0, 0, 0); // 오늘 저녁 10시(22:00)

        // 이미 오늘 10시가 지났으면 다음 날 10시를 타겟으로
        if (now >= target) {
            target.setDate(target.getDate() + 1);
        }

        const diff = Math.floor((target - now) / 1000); // 남은 초

        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;

        document.getElementById('timer-hours').textContent = String(h).padStart(2, '0');
        document.getElementById('timer-minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('timer-seconds').textContent = String(s).padStart(2, '0');
    }

    // 초기화 실행
    setInterval(updateTimer, 1000);
    renderProducts();

</script>

<style>
    /* ===== timedeal 전용: navbar 다크 배경 + 흰 글씨 ===== */
    nav.fixed {
        background-color: rgba(3, 7, 18, 0.85) !important;  /* 흰색 대신 다크 */
        border-color: rgba(255, 255, 255, 0.08) !important;
    }
    /* 상단바 글씨·아이콘 전부 흰색 */
    nav.fixed a,
    nav.fixed button,
    nav.fixed span,
    nav.fixed i {
        color: #ffffff !important;
    }
</style>
</body>
</html>
