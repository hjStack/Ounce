
<!DOCTYPE html>
<html lang="ko">
<head th:replace="~{fragments/head :: head(title='미드나이트 - Ounce')}">
    <!-- 헤드 프래그먼트가 적용되더라도 기본적으로 필요한 메타/링크는 헤드 안에 안전하게 둡니다 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timedeal</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        foreground: { 400: '#9ca3af', 500: '#6b7280', 600: '#4b5563', 700: '#374151', 800: '#1f2937', 900: '#111827', 950: '#030712' },
                        background: { 50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb' },
                        primary:    { 400: '#ffffff', 500: '#ffffff' },
                        accent:     { 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' }
                    },
                    fontFamily: {
                        sans: ['Pacifico', 'sans-serif'],
                        heading: ['Pacifico', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-foreground-950 text-white font-sans min-h-screen">

<main class="pt-10">
    <!-- Hero Banner -->
    <div class="relative w-full h-[420px] overflow-hidden bg-foreground-900 flex flex-col items-center justify-center text-center px-4">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="absolute inset-0 bg-gradient-to-b from-foreground-950/70 to-foreground-950/90 z-0"></div>

        <div class="relative z-10">
            <h1 class="text-4xl md:text-6xl font-semibold mb-3">Midnight <span class="italic font-normal">Sale</span></h1>
            <p class="text-white/60 mb-8">매일 저녁 10시~11시, 선착순 한정 수량</p>

            <!-- 타이머 영역 -->
            <div class="flex items-center gap-4 md:gap-6 justify-center">
                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 flex items-center justify-center bg-white/5 border border-white/10 rounded-sm">
                        <span id="timer-hours" class="text-2xl font-semibold">00</span>
                    </div>
                    <span class="text-xs text-white/40 mt-2">시간</span>
                </div>
                <span class="text-2xl font-light text-white/20">:</span>
                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 flex items-center justify-center bg-white/5 border border-white/10 rounded-sm">
                        <span id="timer-minutes" class="text-2xl font-semibold">00</span>
                    </div>
                    <span class="text-xs text-white/40 mt-2">분</span>
                </div>
                <span class="text-2xl font-light text-white/20">:</span>
                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 flex items-center justify-center bg-white/5 border border-white/10 rounded-sm">
                        <span id="timer-seconds" class="text-2xl font-semibold text-accent-400">00</span>
                    </div>
                    <span class="text-xs text-white/40 mt-2">초</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sorting & Grid Area -->
    <div class="px-4 md:px-8 lg:px-12 py-8">
        <div class="flex items-center gap-2 mb-6" id="sort-buttons">
            <span class="text-sm text-white/40 mr-2">정렬:</span>
            <button data-sort="popular" class="sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-accent-500 text-white cursor-pointer">인기순</button>
            <button data-sort="discount" class="sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-white/5 text-white/50 hover:bg-white/10 cursor-pointer">할인율순</button>
            <button data-sort="price" class="sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-white/5 text-white/50 hover:bg-white/10 cursor-pointer">낮은 가격순</button>
        </div>

        <!-- 상품 카드들이 렌더링될 타겟 DOM -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- JS가 여기에 카드를 삽입합니다 -->
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    let realProducts = [];
    let currentSort = 'popular';

    // 1. 서버에서 데이터 가져오기 (추가된 핵심 로직!)
    async function fetchTimeDealProducts() {
        try {
            // 소문자 timedeal 로 통일!
            const response = await fetch('/api/timedeal');
            if (response.ok) {
                realProducts = await response.json();
                renderProducts();
            } else {
                console.error("데이터를 불러오지 못했습니다.");
            }
        } catch (error) {
            console.error("API 통신 에러:", error);
        }
    }

    // 2. 화면 그리기 (방어 로직 완벽 통합본 🌟)
    function renderProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';

        // 🌟 백엔드에서 빈 배열( [] )이 왔을 때의 완벽한 방어 로직
        if (!realProducts || realProducts.length === 0) {
            // grid를 잠시 1열로 꽉 차게 만들고 안내 문구를 띄웁니다.
            grid.className = "flex flex-col items-center justify-center py-20 w-full";
            grid.innerHTML = `
                <i class="ri-moon-clear-line text-6xl text-white/20 mb-4 animate-pulse"></i>
                <h3 class="text-xl font-medium text-white/80">지금은 미드나이트 세일 준비 중입니다</h3>
                <p class="text-sm text-white/40 mt-2">오늘 밤 10시, 엄청난 특가 상품이 공개됩니다!</p>
            `;
            return; // 텅 빈 화면을 그렸으니 여기서 함수를 즉시 종료합니다.
        }

        // 데이터가 있을 때는 다시 원래의 4열 그리드로 복구
        grid.className = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4";

        // 정렬 로직
        const sorted = [...realProducts].sort((a, b) => {
            if (currentSort === 'discount') return b.discountPercent - a.discountPercent;
            if (currentSort === 'price')    return a.salePrice - b.salePrice;
            return 0;
        });
        // 상품 카드 그리기
        sorted.forEach((product) => {
            const originalPrice  = product.basePrice;
            const discountPrice  = product.salePrice;

            const imageUrl = product.imageUrl;

            const totalStock   = 50;                                  // TODO: 실제 한정수량으로 교체
            const remaining   = (product.stock && product.stock > 0) ? product.stock : totalStock;  // 🧪 임시: 값 없으면 꽉 찬 걸로
            // Redis/DB 재고
            const currentSold  = Math.max(totalStock - remaining, 0);
            const isSoldOut    = remaining <= 0;
            const progress     = Math.min((currentSold / totalStock) * 100, 100);


            const cardHTML = `
      <div class="bg-foreground-900/40 rounded-lg overflow-hidden border border-white/5 relative cursor-pointer hover:border-accent-400/30 transition-all">
        <div class="relative w-full aspect-square bg-foreground-800 overflow-hidden">
          <img src="${imageUrl}" class="absolute inset-0 w-full h-full object-cover" alt="${product.name}">
          ${isSoldOut ? `<div class="absolute inset-0 bg-foreground-950/70 flex items-center justify-center"><span class="px-5 py-2.5 bg-foreground-800 font-bold rounded-md">품절</span></div>` : ''}
        </div>
        <div class="p-4">
          <h3 class="text-sm font-medium line-clamp-2">${product.name}</h3>
          <div class="mt-2 flex gap-2 items-end">
            <span class="text-xl font-bold text-accent-400">${discountPrice.toLocaleString()}원</span>
            <span class="text-sm text-white/40 line-through">${originalPrice.toLocaleString()}원</span>
          </div>

          <div class="mt-3">
            <div class="flex justify-between text-xs mb-1.5">
              <span class="text-primary-400">${isSoldOut ? '판매 완료' : `재고 ${remaining}개 남음`}</span>
              <span class="text-white/40">${currentSold}/${totalStock}</span>
            </div>
            <div class="w-full h-2 bg-white/10 rounded-full">
              <div class="h-full bg-accent-500 rounded-full transition-all" style="width: ${progress}%"></div>
            </div>
          </div>

          <button class="w-full mt-3 py-2.5 rounded-md text-sm font-semibold ${isSoldOut ? 'bg-white/5 text-white/30 cursor-not-allowed' : 'bg-accent-500 hover:bg-accent-400'}" ${isSoldOut ? 'disabled' : ''} onclick="addToCart(${product.productId})">
            ${isSoldOut ? '품절' : '장바구니에 담기'}
          </button>
        </div>
      </div>
    `;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });
    }

    // 3. 정렬 버튼 이벤트
    document.getElementById('sort-buttons').addEventListener('click', (e) => {
        if(e.target.classList.contains('sort-btn')) {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.className = 'sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-white/5 text-white/50 hover:bg-white/10 cursor-pointer';
            });
            e.target.className = 'sort-btn px-4 py-2 rounded-sm text-sm font-medium bg-accent-500 text-white cursor-pointer';
            currentSort = e.target.dataset.sort;

            console.log(realProducts);
            renderProducts();
        }
    });

    // 4. 타이머 로직
    function updateTimer(){
        const now = new Date();
        const target = new Date();
        target.setHours(22, 0, 0, 0);
        if (now >= target) target.setDate(target.getDate() + 1);
        const diff = Math.floor((target - now) / 1000);

        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;

        document.getElementById('timer-hours').textContent = String(h).padStart(2, '0');
        document.getElementById('timer-minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('timer-seconds').textContent = String(s).padStart(2, '0');
    }

    async function addToCart(productId) {
        try {
            // @RequestParam이라 쿼리 파라미터로 전송!
            const response = await fetch(`/api/carts/items?productId=${productId}&quantity=1`, {
                method: 'POST',
                credentials: 'include'
            });

            if (response.ok) {
                alert('🛒 장바구니에 담았습니다!');
                await refreshCartBadge();   // 담고 나서 뱃지 갱신 (아래 참고)
            } else if (response.status === 401) {
                alert('로그인이 필요합니다.');
                window.location.href = '/login';
            } else {
                alert('장바구니 담기에 실패했습니다.');
            }
        } catch (e) {
            console.error(e);
            alert('네트워크 오류가 발생했습니다.');
        }
    }

    async function refreshCartBadge() {
        try {
            const res = await fetch('/api/carts/me', { credentials: 'include' });
            if (!res.ok) return;
            const cart = await res.json();
            if (!Array.isArray(cart)) return;
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.querySelectorAll('.cart-badge').forEach(badge => {
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            });
        } catch (e) { /* 조용히 무시 */ }
    }





    // 최초 1회 실행부
    fetchTimeDealProducts(); // 서버에서 데이터 가져오기!
    setInterval(updateTimer, 1000);


</script>

<style>
    nav.fixed { background-color: rgba(3, 7, 18, 0.85) !important; border-color: rgba(255, 255, 255, 0.08) !important; }
    nav.fixed a, nav.fixed button, nav.fixed span, nav.fixed i { color: #ffffff !important; }
    nav.fixed a[href*="cart"] span { color: #ff7f00 !important; font-weight: 700 !important; }
    #search-overlay a, #search-overlay span, #search-overlay p { color: #475569 !important; }
    #search-overlay input, #search-overlay button { color: #0f172a !important; }
    #search-overlay input::placeholder { color: #64748b !important; }
    #search-back i, #search-close i { color: #94a3b8 !important; }
    #search-overlay div[class*="focus-within:ring-primary"]:focus-within { --tw-ring-color: rgba(255, 127, 0, 0.45) !important; }
</style>
</body>
</html>
