<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='로그인')}"></head>
<body class="bg-background-100 min-h-screen flex flex-col">

<div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

        <!-- 로고 -->
        <div class="text-center mb-8">
            <a href="/" class="font-heading text-4xl text-primary-600">Ounce</a>
            <p class="text-sm text-foreground-500 mt-2">한 사람을 위한 완벽한 한 끼</p>
        </div>

        <!-- 카드 -->
        <div class="bg-white rounded-2xl border border-background-200 shadow-sm p-8 md:p-10">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-foreground-950">로그인</h2>
                <p class="text-sm text-foreground-500 mt-1">Ounce에 오신 것을 환영합니다</p>
            </div>

            <form id="loginForm" class="flex flex-col gap-5">
                <div>
                    <label class="block text-sm font-medium text-foreground-700 mb-1.5">이메일</label>
                    <input type="email" id="email" placeholder="이메일을 입력하세요" required
                           class="w-full px-4 py-3 rounded-lg border border-background-200 bg-background-50 text-foreground-900
                                  placeholder-foreground-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-100
                                  focus:outline-none transition-colors"/>
                    <div id="emailError" class="text-xs text-red-500 mt-1"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-foreground-700 mb-1.5">비밀번호</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="비밀번호를 입력하세요" required
                               class="w-full px-4 py-3 pr-12 rounded-lg border border-background-200 bg-background-50 text-foreground-900
                      placeholder-foreground-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-100
                      focus:outline-none transition-colors"/>
                        <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2
                text-foreground-400 hover:text-foreground-600 transition-colors" aria-label="비밀번호 표시">
                            <i class="ri-eye-line text-lg"></i>
                        </button>
                    </div>
                    <div id="passwordError" class="text-xs text-red-500 mt-1"></div>
                </div>

                <button type="submit"
                        class="w-full py-3.5 mt-2 bg-foreground-950 hover:bg-foreground-800 text-white font-medium
                               rounded-lg transition-colors">
                    로그인
                </button>
            </form>

            <!-- 구분선 -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-background-200"></div>
                <span class="text-xs text-foreground-400">또는</span>
                <div class="flex-1 h-px bg-background-200"></div>
            </div>

            <!-- 소셜 로그인 -->
            <button type="button" onclick="location.href='/oauth2/authorization/google'"
                    class="w-full py-3 flex items-center justify-center gap-2 border border-background-200
                           rounded-lg hover:bg-background-50 transition-colors text-sm font-medium text-foreground-700">
                <i class="ri-google-fill text-base"></i> Google로 계속하기
            </button>

            <!-- 하단 -->
            <div class="text-center mt-6">
                <p class="text-sm text-foreground-500">
                    아직 계정이 없으신가요?
                    <a href="/signup" class="text-primary-600 hover:text-primary-700 font-medium">회원가입</a>
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/login.js"></script>
</body>
</html>
