<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(title='내 계정 - Ounce')}"></head>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="/favicon.png?v=2">
<body class="bg-[#fcfbf9]">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/toast :: toast(${toastMessage}, ${toastType})}"></div>

<main class="min-h-screen pt-20 md:pt-24">
    <div class="w-full px-4 md:px-8 lg:px-12 py-6 max-w-6xl mx-auto">

        <div class="mb-8">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-8 h-px bg-[#d95d22]"></div>
                <span class="text-[#d95d22] text-xs font-bold tracking-[0.2em]">MY ACCOUNT</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">내 계정</h1>
            <p class="text-sm text-gray-500 mt-1">Ounce와 함께한 당신의 감각적인 여정</p>
        </div>

        <!-- Stats cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-8">
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">총 주문</div>
                <div class="text-2xl font-bold text-gray-900" id="stat-total-orders">0건</div>
            </div>
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">누적 결제</div>
                <div class="text-2xl font-bold text-gray-900" id="stat-total-spent">0원</div>
            </div>
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">배송 완료</div>
                <div class="text-2xl font-bold text-gray-900" id="stat-delivered">0건</div>
            </div>
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">보유 쿠폰</div>
                <div class="text-2xl font-bold text-[#d95d22]" id="stat-coupons">0장</div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Left: Profile -->
            <div class="w-full lg:w-80 flex-shrink-0">
                <div class="p-6 bg-white border border-gray-100 rounded-xl">
                    <div class="flex items-center gap-4 mb-5">
                        <div class="w-14 h-14 flex items-center justify-center rounded-full bg-gray-900 text-white text-xl font-bold" id="profile-avatar">U</div>
                        <div>
                            <div class="text-sm font-bold text-gray-900" id="profile-name">사용자님</div>
                            <div class="text-xs text-gray-400" id="profile-email">user@example.com</div>
                        </div>
                    </div>

                    <div class="h-px bg-gray-100 mb-4"></div>

                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">이름</span>
                            <span class="text-gray-800 font-medium" id="detail-name">-</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">이메일</span>
                            <span class="text-gray-800 font-medium" id="detail-email">-</span>
                        </div>
                        <div class="flex justify-between text-sm items-center">
                            <span class="text-gray-400">회원 등급</span>
                            <span class="px-2.5 py-0.5 text-xs font-medium rounded-full bg-[#fdf0e8] text-[#d95d22]">Ounce VIP</span>
                        </div>
                        <a href="#" class="mt-3 py-2.5 text-sm font-medium text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors text-center">프로필 수정</a>
                    </div>
                </div>

                <!-- Quick links -->
                <div class="mt-4 p-5 bg-white border border-gray-100 rounded-xl">
                    <div class="text-xs font-bold text-gray-900 mb-3">바로가기</div>
                    <div class="flex flex-col gap-1">
                        <a href="/orders" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
                            <i class="ri-file-list-3-line text-gray-400"></i> 주문 내역
                        </a>
                        <a href="/cart" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
                            <i class="ri-shopping-cart-2-line text-gray-400"></i> 장바구니
                        </a>
                        <a href="/products" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
                            <i class="ri-store-line text-gray-400"></i> 큐레이션 둘러보기
                        </a>
                    </div>
                </div>
            </div>

            <!-- Right: Recent orders -->
            <div class="flex-1">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-bold text-gray-900">최근 주문</h2>
                    <a href="/orders" class="text-xs text-gray-500 hover:text-gray-900 transition-colors">전체 보기 →</a>
                </div>

                <div class="flex flex-col gap-3" id="recent-orders">
                    <div class="py-16 text-center text-sm text-gray-400 bg-white border border-gray-100 rounded-xl">아직 주문 내역이 없습니다.</div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="none">
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/members/me', { credentials: 'include' })
            .then(res => res.ok ? res.json() : null)
            .then(data => {
                if (!data) return;

                const namePart = data.email.split('@')[0];

                const setText = (id, value) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = value;
                };

                setText('profile-name', namePart + '님');
                setText('profile-email', data.email);
                setText('detail-name', namePart);
                setText('detail-email', data.email);

                const avatar = document.getElementById('profile-avatar');
                if (avatar) avatar.textContent = namePart.charAt(0).toUpperCase();
            })
            .catch(err => console.error('유저 정보 조회 실패:', err));
    });
</script>

</body>
</html>
