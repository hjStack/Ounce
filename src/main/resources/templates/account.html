<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(title='계정')}">

</head>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="/favicon.png?v=2">
<body class="bg-[#fcfbf9]">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/toast :: toast(${toastMessage}, ${toastType})}"></div>

<main class="min-h-screen pt-20 md:pt-24">
    <div class="w-full px-4 md:px-8 lg:px-12 py-6 max-w-6xl mx-auto">

        <div class="mb-8">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-8 h-px bg-[#d95d22]"></div>
                <span class="text-[#d95d22] text-xs font-bold tracking-[0.2em]">MY ACCOUNT</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">내 계정</h1>
            <p class="text-sm text-gray-500 mt-1">Ounce와 함께한 당신의 감각적인 여정</p>
        </div>

        <!-- Stats cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-8">
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">총 주문</div>
                <div class="text-2xl font-bold text-gray-900" id="stat-total-orders">0건</div>
            </div>
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">누적 결제</div>
                <div class="text-2xl font-bold text-gray-900" id="stat-total-spent">0원</div>
            </div>
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">배송 완료</div>
                <div class="text-2xl font-bold text-gray-900" id="stat-delivered">0건</div>
            </div>
            <div class="p-5 bg-white border border-gray-100 rounded-xl">
                <div class="text-xs text-gray-400 mb-1.5">보유 쿠폰</div>
                <div class="text-2xl font-bold text-[#d95d22]" id="stat-coupons">0장</div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Left: Profile -->
            <div class="w-full lg:w-80 flex-shrink-0">
                <div class="p-6 bg-white border border-gray-100 rounded-xl">
                    <div class="flex items-center gap-4 mb-5">
                        <div class="w-14 h-14 flex items-center justify-center rounded-full bg-gray-900 text-white text-xl font-bold" id="profile-avatar">U</div>
                        <div>
                            <div class="text-sm font-bold text-gray-900" id="profile-name">사용자님</div>
                            <div class="text-xs text-gray-400" id="profile-email">user@example.com</div>
                        </div>
                    </div>

                    <div class="h-px bg-gray-100 mb-4"></div>

                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">이름</span>
                            <span class="text-gray-800 font-medium" id="detail-name">-</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">이메일</span>
                            <span class="text-gray-800 font-medium" id="detail-email">-</span>
                        </div>
                        <div class="flex justify-between text-sm items-center">
                            <span class="text-gray-400">회원 등급</span>
                            <span id="member-grade" class="px-2.5 py-0.5 text-xs font-medium rounded-full bg-[#fdf0e8] text-[#d95d22]">BASIC</span>
                        </div>
                        <div class="flex justify-between text-sm items-center">
                            <span class="text-gray-400">포인트</span>
                            <span id="point" class="text-sm font-bold text-gray-900 tabular-nums">-</span>
                        </div>
                        <a href="#" class="mt-3 py-2.5 text-sm font-medium text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors text-center">프로필 수정</a>
                    </div>
                </div>

                <!-- Quick links -->
                <div class="mt-4 p-5 bg-white border border-gray-100 rounded-xl">
                    <div class="text-xs font-bold text-gray-900 mb-3">바로가기</div>
                    <div class="flex flex-col gap-1">
                        <a href="/orders" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
                            <i class="ri-file-list-3-line text-gray-400"></i> 주문 내역
                        </a>
                        <a href="/cart" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
                            <i class="ri-shopping-cart-2-line text-gray-400"></i> 장바구니
                        </a>
                        <a href="/products" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
                            <i class="ri-store-line text-gray-400"></i> 상품 둘러보기
                        </a>
                    </div>
                </div>

                <div class="mt-6 flex justify-start">
                    <button type="button" id="withdraw-btn"
                            class="inline-flex items-center gap-1 text-xs text-gray-400 hover:text-red-400 transition-colors">
                        <i class="ri-logout-box-r-line"></i> 회원 탈퇴
                    </button>
                </div>
            </div>

            <div class="flex-1">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-bold text-gray-900">최근 주문</h2>
                    <a href="/orders" class="text-xs text-gray-500 hover:text-gray-900 transition-colors">전체 보기 →</a>
                </div>

                <div class="flex flex-col gap-3" id="recent-orders">
                    <div class="py-16 text-center text-sm text-gray-400 bg-white border border-gray-100 rounded-xl">아직 주문 내역이 없습니다.</div>
                </div>
            </div>
        </div>
    </div>


    <!-- 회원 탈퇴 확인 모달 -->
    <div id="withdraw-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/50 backdrop-blur-sm px-4">
        <div class="w-full max-w-sm bg-white rounded-2xl p-7 shadow-2xl">
            <!-- 아이콘 -->
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-red-50 mb-4">
                <i class="ri-error-warning-line text-2xl text-red-500"></i>
            </div>

            <h3 class="text-lg font-bold text-gray-900 mb-2">정말 탈퇴하시겠어요?</h3>

            <p class="text-sm text-gray-500 leading-relaxed mb-5">
                탈퇴 시 주문 내역, 포인트, 쿠폰, 장바구니 등 모든 정보가 삭제되며
                <span class="font-medium text-gray-700">복구할 수 없습니다.</span>
            </p>

            <div class="mb-5">
                <p class="text-sm text-gray-600 mb-2">
                    계속하시려면 <span class="font-bold text-red-500">ounce를 탈퇴합니다.</span>를 입력해주세요.
                </p>
                <input type="text" id="withdraw-confirm-input" placeholder="ounce를 탈퇴합니다." autocomplete="off"
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm text-gray-900
                      placeholder-gray-300 focus:border-red-400 focus:ring-4 focus:ring-red-50
                      focus:outline-none transition"/>
            </div>

            <div class="flex gap-2">
                <button type="button" id="withdraw-cancel"
                        class="flex-1 py-2.5 text-sm font-medium text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                    취소
                </button>
                <button type="button" id="withdraw-confirm" disabled
                        class="flex-1 py-2.5 text-sm font-medium text-white bg-red-200 rounded-lg cursor-not-allowed transition">
                    탈퇴하기
                </button>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="none">
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/members/me', { credentials: 'include' })
            .then(res => res.ok ? res.json() : null)
            .then(data => {
                if (!data) return;

                const namePart = data.name;

                const setText = (id, value) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = value;
                };

                setText('profile-name', namePart + '님');
                setText('profile-email', data.email);
                setText('detail-name', namePart);
                setText('detail-email', data.email);

                // 👇 추가 — 포인트 (숫자에 콤마 찍어서)
                setText('point', data.point.toLocaleString() + 'P');
                setText('member-grade', data.grade);

                const avatar = document.getElementById('profile-avatar');
                if (avatar) avatar.textContent = namePart.charAt(0).toUpperCase();
            })
            .catch(err => console.error('유저 정보 조회 실패:', err));
    });

    // ── 회원 탈퇴 ──

    const modal = document.getElementById('withdraw-modal');
    const confirmInput = document.getElementById('withdraw-confirm-input');
    const confirmBtn = document.getElementById('withdraw-confirm');
    const CONFIRM_TEXT = 'ounce를 탈퇴합니다.';

    const openWithdrawModal = () => modal.classList.replace('hidden', 'flex');
    const closeWithdrawModal = () => {
        modal.classList.replace('flex', 'hidden');
        confirmInput.value = '';
        updateBtnState();
    };

    // 입력값이 정확히 일치할 때만 버튼 활성화
    const updateBtnState = () => {
        const match = confirmInput.value.trim() === CONFIRM_TEXT;
        confirmBtn.disabled = !match;
        confirmBtn.className = match
            ? 'flex-1 py-2.5 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition'
            : 'flex-1 py-2.5 text-sm font-medium text-white bg-red-200 rounded-lg cursor-not-allowed transition';
    };

    document.getElementById('withdraw-btn').addEventListener('click', openWithdrawModal);
    document.getElementById('withdraw-cancel').addEventListener('click', closeWithdrawModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeWithdrawModal(); });
    confirmInput.addEventListener('input', updateBtnState);

    confirmBtn.addEventListener('click', function () {
        if (confirmInput.value.trim() !== CONFIRM_TEXT) return;

        confirmBtn.disabled = true;
        confirmBtn.textContent = '처리 중...';

        fetch('/api/members/me', { method: 'DELETE', credentials: 'include' })
            .then(res => {
                if (res.ok) {
                    location.href = '/?withdrawn=true';
                } else {
                    alert('탈퇴 처리에 실패했습니다. 잠시 후 다시 시도해주세요.');
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = '탈퇴하기';
                }
            })
            .catch(err => {
                console.error('회원 탈퇴 실패:', err);
                alert('네트워크 오류가 발생했습니다.');
                confirmBtn.disabled = false;
                confirmBtn.textContent = '탈퇴하기';
            });
    });
</script>

</body>
</html>
