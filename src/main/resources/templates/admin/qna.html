<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='문의 관리 — Ounce 관리자')}"></head>
<!-- 관리자 콘솔은 고객 화면의 내비바·푸터를 쓰지 않는다.
     같은 껍데기를 쓰면 지금 보고 있는 게 고객 화면인지 관리 화면인지 헷갈리고,
     실수로 고객에게 보일 화면에서 답변을 쓰게 된다. 상단 바 색부터 다르게 뒀다. -->
<body class="bg-background-100">

<style>
    [aria-expanded="true"] .acc-chevron { transform: rotate(180deg); }
    .acc-chevron { transition: transform .18s ease-out; }
    .qna-body { white-space: pre-line; word-break: break-word; }
</style>

<!-- ══ 상단 바 ═══════════════════════════════════════════════ -->
<header class="sticky top-0 z-40 bg-ink-600 text-white">
    <div class="w-full px-4 md:px-8 py-3 max-w-6xl mx-auto flex items-center gap-4">
        <a href="/" class="font-heading italic text-lg text-white/90 hover:text-white transition-colors">Ounce</a>
        <span class="px-2 py-0.5 text-[10px] font-bold tracking-wider rounded bg-white/15 text-white/90">ADMIN</span>
        <nav class="ml-2 flex items-center gap-1 text-sm">
            <span class="px-3 py-1.5 rounded-lg bg-white/10 font-semibold">문의 관리</span>
        </nav>
        <a href="/support" target="_blank" rel="noopener"
           class="ml-auto flex items-center gap-1.5 text-xs text-white/70 hover:text-white transition-colors">
            <i class="ri-external-link-line"></i> 고객 화면 보기
        </a>
    </div>
</header>

<main class="w-full px-4 md:px-8 py-6 md:py-8 max-w-6xl mx-auto">

    <!-- ── Header ─────────────────────────────────────── -->
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-foreground-950 tracking-tight">문의 관리</h1>
            <p class="text-sm text-foreground-500 mt-1">
                고객에게 약속한 답변 시간은 <b class="font-semibold text-foreground-700">영업일 기준 1일</b>입니다.
            </p>
        </div>
        <button id="refresh-btn" type="button"
                class="flex items-center gap-1.5 px-4 py-2 bg-white border border-background-300 text-sm
                       font-medium text-foreground-700 rounded-lg hover:bg-background-100 transition-colors">
            <i class="ri-refresh-line text-base"></i> 새로고침
        </button>
    </div>

    <!-- ── 대기 현황 ───────────────────────────────────
         관리자가 이 화면에서 알아야 할 건 "몇 건 밀려 있고, 그중 늦은 게 있나"다. -->
    <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="rounded-xl border border-background-300 bg-white p-4">
            <p class="text-[10px] tracking-wide text-foreground-400 mb-1.5">답변 대기</p>
            <p id="stat-waiting" class="text-xl font-bold leading-none text-foreground-950 tabular-nums">–</p>
        </div>
        <div class="rounded-xl border border-background-300 bg-white p-4">
            <p class="text-[10px] tracking-wide text-foreground-400 mb-1.5">답변 완료</p>
            <p id="stat-answered" class="text-xl font-bold leading-none text-foreground-950 tabular-nums">–</p>
        </div>
        <!-- 하루가 지난 대기 건. 0 이 아니면 색을 바꿔서 눈에 띄게 한다. -->
        <div id="stat-overdue-card" class="rounded-xl border border-background-300 bg-white p-4">
            <p class="text-[10px] tracking-wide text-foreground-400 mb-1.5">1일 초과 대기</p>
            <p id="stat-overdue" class="text-xl font-bold leading-none text-foreground-950 tabular-nums">–</p>
        </div>
    </div>

    <!-- ── 필터 ───────────────────────────────────────
         기본값은 '답변 대기'. 관리자가 이 화면을 여는 이유는 처리할 일을 찾기 위해서다. -->
    <div class="flex flex-wrap items-center gap-2 mb-4">
        <div id="status-tabs" class="flex items-center gap-1 p-1 rounded-xl bg-background-200/70"></div>
        <div class="ml-auto flex items-center gap-2 rounded-lg border border-background-300 bg-white px-3 py-2
                    focus-within:border-primary-400 transition-colors">
            <i class="ri-search-line text-foreground-400 text-sm"></i>
            <label for="admin-search" class="sr-only">현재 목록 검색</label>
            <input id="admin-search" type="text" autocomplete="off" placeholder="이 페이지에서 찾기 (회원·제목·내용)"
                   class="w-52 md:w-64 bg-transparent text-sm text-foreground-950 placeholder-foreground-400 focus:outline-none"/>
        </div>
    </div>

    <div id="qna-list" class="flex flex-col gap-2"></div>
    <p id="qna-status" class="hidden py-16 text-center text-sm text-foreground-400"></p>

    <!-- ── 페이지 이동 ────────────────────────────────
         고객 화면은 '더 보기'지만 관리자는 앞뒤로 오가며 훑기 때문에 페이지 단위로 둔다. -->
    <div id="pager" class="hidden items-center justify-center gap-3 mt-6">
        <button id="prev-btn" type="button"
                class="flex items-center gap-1 px-4 py-2 bg-white border border-background-300 text-sm font-medium
                       text-foreground-700 rounded-lg hover:bg-background-100 transition-colors
                       disabled:opacity-40 disabled:hover:bg-white">
            <i class="ri-arrow-left-s-line"></i> 이전
        </button>
        <p class="text-sm text-foreground-500 tabular-nums">
            <span id="page-current">1</span> / <span id="page-total">1</span>
        </p>
        <button id="next-btn" type="button"
                class="flex items-center gap-1 px-4 py-2 bg-white border border-background-300 text-sm font-medium
                       text-foreground-700 rounded-lg hover:bg-background-100 transition-colors
                       disabled:opacity-40 disabled:hover:bg-white">
            다음 <i class="ri-arrow-right-s-line"></i>
        </button>
    </div>
</main>

<script src="/js/product-card.js"></script>
<script src="/js/admin-qna.js"></script>
</body>
</html>
