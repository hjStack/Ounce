<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='장바구니 - Ounce')}"></head>
<body class="bg-white">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/toast :: toast(${toastMessage}, ${toastType})}"></div>

<div th:if="${#lists.isEmpty(cartLines)}" class="min-h-screen bg-background-50 flex items-center justify-center px-4 pt-20">
    <div class="text-center max-w-sm">
        <i class="ri-shopping-bag-line text-5xl text-foreground-300 mb-4 block"></i>
        <h1 class="text-xl font-bold text-foreground-950 mb-2">장바구니가 비어 있어요</h1>
        <p class="text-sm text-foreground-500 mb-6">Ounce의 감각적인 큐레이션을 담아보세요.</p>
        <a href="/products" class="inline-block px-6 py-2.5 bg-primary-500 text-white text-sm font-semibold rounded-md hover:bg-primary-600 transition-colors">
            큐레이션 둘러보기
        </a>
    </div>
</div>

<div th:unless="${#lists.isEmpty(cartLines)}" class="min-h-screen bg-background-50 pt-20 md:pt-24">
    <div class="w-full px-4 md:px-8 lg:px-12 py-6">
        <div class="mb-6">
            <h1 class="text-xl md:text-2xl font-bold text-foreground-950 font-heading">장바구니</h1>
            <p class="text-sm text-foreground-500 mt-1" th:text="${totalItems} + '개의 상품이 담겨 있어요'">0개의 상품이 담겨 있어요</p>
        </div>

        <!-- Urgency banners -->
        <div class="flex flex-col gap-2 mb-6">
            <div class="flex items-center gap-2 px-3 py-2 bg-accent-500/10 border border-accent-500/20 rounded-lg">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-accent-500"></span>
                </span>
                <span class="text-xs font-medium text-accent-700">
                    지금 <strong id="viewer-count" class="text-accent-900">42명</strong>이 장바구니를 확인하고 있어요
                </span>
            </div>

            <div id="deadline-banner" class="flex items-center gap-2 px-3 py-2 rounded-lg border bg-primary-500/10 border-primary-500/15">
                <i class="ri-time-line text-sm text-primary-500"></i>
                <span class="text-xs font-medium text-primary-700">
                    오늘 밤 12시까지 주문 시 <strong id="deadline-timer" class="text-primary-900">--:--:--</strong> 남음 — 내일 아침 7시 전 도착
                </span>
            </div>

            <div class="flex items-center gap-2 px-3 py-2 bg-primary-500/10 border border-primary-500/15 rounded-lg">
                <i class="ri-shopping-bag-3-fill text-primary-500 text-xs"></i>
                <span id="purchase-ticker" class="text-xs text-primary-700">
                    <strong>서울</strong>에서 <strong>1분 전</strong> 결제 완료
                </span>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Left: Product list -->
            <div class="flex-1 flex flex-col gap-4">
                <div th:each="line : ${cartLines}" class="flex gap-4 p-4 bg-background-50 border border-background-200 rounded-lg hover:border-background-300 transition-colors">
                    <div class="flex-shrink-0 w-20 h-20 md:w-24 md:h-24 rounded-md overflow-hidden bg-background-100">
                        <img th:src="${line.product.imageUrl}" th:alt="${line.product.name}" class="w-full h-full object-cover"/>
                    </div>
                    <div class="flex-1 flex flex-col justify-between min-w-0">
                        <div>
                            <p class="text-sm font-medium text-foreground-950 line-clamp-2" th:text="${line.product.name}">상품명</p>
                        </div>
                        <div class="flex items-center justify-between mt-2">
                            <form th:action="@{/cart/update}" method="post" class="flex items-center gap-2">
                                <input type="hidden" name="productId" th:value="${line.product.productId}"/>
                                <button type="submit" name="delta" value="-1"
                                        class="w-7 h-7 flex items-center justify-center border border-background-300 rounded text-foreground-600 hover:bg-background-100 transition-colors">
                                    <i class="ri-subtract-line text-xs"></i>
                                </button>
                                <span class="text-sm font-medium text-foreground-800 w-6 text-center" th:text="${line.quantity}">1</span>
                                <button type="submit" name="delta" value="1"
                                        class="w-7 h-7 flex items-center justify-center border border-background-300 rounded text-foreground-600 hover:bg-background-100 transition-colors">
                                    <i class="ri-add-line text-xs"></i>
                                </button>
                            </form>
                            <div class="flex items-center gap-3">
                                <span class="text-sm font-bold text-foreground-950"
                                      th:text="${#numbers.formatInteger(line.lineTotal,0,'COMMA')} + '원'">0원</span>
                                <form th:action="@{/cart/remove}" method="post">
                                    <input type="hidden" name="productId" th:value="${line.product.productId}"/>
                                    <button type="submit" class="w-7 h-7 flex items-center justify-center text-foreground-400 hover:text-accent-500 transition-colors">
                                        <i class="ri-close-line"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Order summary -->
            <div class="w-full lg:w-80 flex-shrink-0">
                <div class="sticky top-24 p-5 bg-background-50 border border-background-200 rounded-lg">
                    <h2 class="text-sm font-bold text-foreground-950 mb-4">주문 요약</h2>

                    <div class="flex flex-col gap-2.5 mb-4">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-foreground-500">상품 금액</span>
                            <span class="text-foreground-800" th:text="${#numbers.formatInteger(totalPrice,0,'COMMA')} + '원'">0원</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-foreground-500">배송비</span>
                            <span th:if="${shipping == 0}" class="text-primary-600 font-medium">무료</span>
                            <span th:unless="${shipping == 0}" class="text-foreground-800"
                                  th:text="${#numbers.formatInteger(shipping,0,'COMMA')} + '원'">0원</span>
                        </div>
                        <div th:if="${amountToFreeShipping > 0}" class="text-xs text-accent-600">
                            <i class="ri-truck-line mr-1"></i>
                            <span th:text="${#numbers.formatInteger(amountToFreeShipping,0,'COMMA')} + '원 더 담으면 무료배송!'">0원 더 담으면 무료배송!</span>
                        </div>
                    </div>

                    <div class="h-px bg-background-200 mb-4"></div>

                    <div class="flex items-center justify-between mb-5">
                        <span class="text-sm font-bold text-foreground-950">총 결제 금액</span>
                        <span class="text-xl font-bold text-accent-500" th:text="${#numbers.formatInteger(finalPrice,0,'COMMA')} + '원'">0원</span>
                    </div>

                    <form th:action="@{/cart/checkout}" method="post">
                        <button type="submit" class="w-full h-12 flex items-center justify-center gap-2 bg-primary-500 text-white font-semibold rounded-md hover:bg-primary-600 transition-colors cursor-pointer">
                            <i class="ri-shopping-bag-line"></i>
                            <span th:text="${#numbers.formatInteger(finalPrice,0,'COMMA')} + '원 결제하기'">결제하기</span>
                        </button>
                    </form>

                    <div class="mt-4 flex items-start gap-2 p-3 bg-secondary-50 rounded-lg">
                        <i class="ri-truck-line text-secondary-600 mt-0.5 text-sm"></i>
                        <div class="text-xs text-secondary-800 leading-relaxed">
                            <strong class="text-secondary-900">새벽배송</strong><br/>
                            오늘 밤 12시까지 주문 → 내일 아침 7시 전 도착
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="none">
    document.addEventListener('DOMContentLoaded', function () {
        var viewerEl = document.getElementById('viewer-count');
        if (viewerEl) {
            var viewerCount = 42;
            setInterval(function () {
                var change = Math.floor(Math.random() * 9) - 4;
                viewerCount = Math.max(12, Math.min(180, viewerCount + change));
                viewerEl.textContent = viewerCount + '명';
            }, 3000 + Math.floor(Math.random() * 3000));
        }

        var timerEl = document.getElementById('deadline-timer');
        if (timerEl) {
            var tick = function () {
                var now = new Date();
                var midnight = new Date(now);
                midnight.setHours(24, 0, 0, 0);
                var diff = midnight.getTime() - now.getTime();
                var totalSeconds = Math.floor(diff / 1000);
                var h = Math.floor(totalSeconds / 3600);
                var m = Math.floor((totalSeconds % 3600) / 60);
                var s = totalSeconds % 60;
                var pad = function (n) { return String(n).padStart(2, '0'); };
                timerEl.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
            };
            tick();
            setInterval(tick, 1000);
        }

        var tickerEl = document.getElementById('purchase-ticker');
        if (tickerEl) {
            var cities = ['서울', '부산', '대구', '인천', '광주', '대전', '울산', '수원', '성남', '고양'];
            setInterval(function () {
                var city = cities[Math.floor(Math.random() * cities.length)];
                var minutes = Math.floor(Math.random() * 5) + 1;
                tickerEl.style.opacity = '0';
                setTimeout(function () {
                    tickerEl.innerHTML = '<strong>' + city + '</strong>에서 <strong>' + minutes + '분 전</strong> 결제 완료';
                    tickerEl.style.opacity = '1';
                }, 150);
            }, 5000 + Math.floor(Math.random() * 5000));
        }
    });
</script>

</body>
</html>
