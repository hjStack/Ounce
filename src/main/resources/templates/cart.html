<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='장바구니')}">
    <link rel="icon" type="image/png" href="/favicon.png?v=2"></head>
<body class="bg-[#fcfbf9]">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/toast :: toast(${toastMessage}, ${toastType})}"></div>

<main class="pt-20 md:pt-24 min-h-screen pb-20">
    <!-- 장바구니가 비어있을 때 보여질 화면 -->
    <div id="empty-cart" class="hidden flex flex-col items-center justify-center px-4 py-32">
        <div class="text-center max-w-sm">
            <!-- 아이콘 -->
            <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
            <h1 class="text-xl font-bold text-gray-900 mb-2">
                장바구니가 비어 있어요
            </h1>
            <p class="text-sm text-gray-500 mb-6">
                텅 빈 장바구니, Ounce의 특별함으로 가득 채워볼까요?
            </p>
            <a href="/products" class="inline-block px-6 py-2.5 bg-[#3b4055] text-white text-sm font-semibold rounded-md hover:bg-gray-800 transition-colors shadow-sm">
                상품 둘러보기
            </a>
        </div>
    </div>

    <!-- 장바구니에 상품이 있을 때 보여질 화면 -->
    <div id="cart-content" class="hidden w-full px-4 md:px-8 lg:px-12 py-6 max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900">장바구니</h1>
            <p id="total-items-text" class="text-sm text-gray-500 mt-1">
                0개의 상품이 담겨 있어요
            </p>
        </div>

        <!-- Urgency banners (실시간 알림 배너들) -->
        <div class="flex flex-col gap-2 mb-6">

            <!-- Delivery deadline countdown -->
            <div id="countdown-banner" class="flex items-center gap-2 px-3 py-2 rounded-lg border bg-[#3b4055]/10 border-[#3b4055]/15 w-fit">
                <svg class="w-4 h-4 text-[#3b4055]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="countdown-text" class="text-xs font-medium text-[#3b4055]">
                    오늘 밤 11시까지 주문 시 <strong id="time-left" class="font-bold text-gray-900">00:00:00</strong> 남음 — 내일 아침 7시 전 도착
                </span>
            </div>

        </div>

        <!-- 오픈 일주일동안만 무료 배송 -->


        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Left: Product list -->



            <div class="flex-1 flex flex-col gap-4">


                <div class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <!-- 💡 text-[#447861] 대신 accent-[#447861] 사용 -->
                        <input type="checkbox" id="check-all" onchange="toggleAll(this.checked)"
                               class="w-5 h-5 accent-[#447861] cursor-pointer rounded">
                        <span class="text-sm font-medium text-gray-700">전체 선택 (<span id="selected-count">0</span>/<span id="total-count">0</span>)</span>
                    </label>
                    <button onclick="removeSelected()" class="text-sm font-medium text-gray-500 hover:text-red-500 transition-colors">선택 삭제</button>
                </div>

                <div id="cart-items-container" class="flex flex-col gap-4">
                    <!-- JS를 통해 아이템들이 렌더링 됩니다 -->
                </div>
            </div>



            <!-- Right: Order summary -->
            <div class="w-full lg:w-80 flex-shrink-0">
                <div class="sticky top-24 p-5 bg-white border border-gray-200 rounded-lg shadow-sm">
                    <h2 class="text-sm font-bold text-gray-900 mb-4">주문 요약</h2>

                    <div class="flex flex-col gap-2.5 mb-4">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">상품 금액</span>
                            <span id="summary-total-price" class="text-gray-800 font-medium">0원</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">배송비</span>
                            <span id="summary-shipping" class="text-[#3b4055] font-medium">무료</span>
                        </div>
                        <div id="free-shipping-msg" class="text-xs text-[#447861] hidden">
                            <span id="amount-needed">0</span>원 더 담으면 무료배송!
                        </div>
                    </div>

                    <div class="h-px bg-gray-200 mb-4"></div>

                    <div class="flex items-center justify-between mb-5">
                        <span class="text-sm font-bold text-gray-900">총 결제 금액</span>
                        <span id="summary-final-price" class="text-xl font-bold text-[#447861]">0원</span>
                    </div>

                    <button id="checkout-btn" onclick="handleCheckout()" class="w-full h-12 flex items-center justify-center gap-2 bg-[#3b4055] text-white font-semibold rounded-md hover:bg-gray-800 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                        <span id="checkout-btn-text">0원 결제하기</span>
                    </button>

                    <div class="mt-4 flex items-start gap-2 p-3 bg-gray-50 rounded-lg border border-gray-100">
                        <svg class="w-4 h-4 text-gray-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                        </svg>
                        <div class="text-xs text-gray-600 leading-relaxed">
                            <strong class="text-gray-900">새벽배송</strong>
                            <br />
                            오늘 밤 11시까지 주문 → 내일 아침 7시 전 도착
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout toast -->
    <div id="checkout-toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 px-6 py-3 bg-gray-900 text-white text-sm font-medium rounded-lg shadow-lg flex items-center gap-2 opacity-0 transition-opacity duration-300 pointer-events-none">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        주문이 완료되었습니다! 주문내역으로 이동합니다
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>

    // 💡 최상단에 ui 객체 및 toast, confirm 함수 정의
    // modal
    const ui = {
        toast: function(message, type = 'success') {
            var existing = document.getElementById('ounce-js-toast');
            if (existing) existing.remove();

            var el = document.createElement('div');
            el.id = 'ounce-js-toast';
            el.className = 'fixed top-24 left-1/2 -translate-x-1/2 z-[70] flex items-center gap-2 px-5 py-3' +
                ' rounded-lg shadow-lg text-sm font-medium text-white transition-opacity duration-300 ' +
                (type === 'error' ? 'bg-red-600' : 'bg-secondary-600');
            el.innerHTML = '<i class="' + (type === 'error' ? 'ri-error-warning-line' : 'ri-check-line') +
                ' text-lg"></i><span></span>';
            el.querySelector('span').textContent = message;
            document.body.appendChild(el);

            setTimeout(function () {
                el.style.opacity = '0';
                setTimeout(function () { el.remove(); }, 300);
            }, 2600);
        },

        // 🌟 새롭게 추가된 커스텀 확인(Confirm) 모달창 함수
        confirm: function(message, onConfirm) {
            let existing = document.getElementById('ounce-js-confirm');
            if (existing) existing.remove();

            let overlay = document.createElement('div');
            overlay.id = 'ounce-js-confirm';
            // 배경을 살짝 어둡게 하고 블러 처리합니다.
            overlay.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 transition-opacity duration-200';

            let box = document.createElement('div');
            box.className = 'bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200';

            box.innerHTML = `
                <div class="flex flex-col items-center text-center mb-6 mt-2">
                    <!-- 은은한 초록색 배경의 휴지통 아이콘 -->
                    <div class="w-14 h-14 bg-[#447861]/10 text-[#447861] rounded-full flex items-center justify-center mb-4">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </div>
                    <p class="text-gray-900 font-bold text-lg break-keep">${message}</p>
                    <p class="text-gray-500 text-sm mt-2">삭제된 상품은 언제든 다시 담으실 수 있어요.</p>
                </div>
                <div class="flex gap-3">
                    <button id="confirm-cancel" class="flex-1 py-3.5 rounded-xl border border-gray-200 text-gray-600 font-semibold hover:bg-gray-50 transition-colors">취소</button>
                    <button id="confirm-ok" class="flex-1 py-3.5 rounded-xl bg-[#447861] text-white font-semibold hover:bg-[#396652] transition-colors shadow-sm focus:ring-2 focus:ring-[#447861]/50 focus:outline-none">확인</button>
                </div>
            `;

            overlay.appendChild(box);
            document.body.appendChild(overlay);

            // 부드럽게 나타나는 애니메이션 적용
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                box.classList.remove('scale-95');
            });

            const closeUI = () => {
                overlay.classList.add('opacity-0');
                box.classList.add('scale-95');
                setTimeout(() => overlay.remove(), 100); // 애니메이션 끝난 후 삭제
            };

            // 취소, 확인 버튼 이벤트 연결
            document.getElementById('confirm-cancel').addEventListener('click', closeUI);
            document.getElementById('confirm-ok').addEventListener('click', () => {
                closeUI();
                if (onConfirm) onConfirm(); // 확인을 눌렀을 때만 콜백 함수 실행
            });
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        // 💡 1. 가짜 로컬 스토리지를 폭파하고, 서버 데이터를 담을 전역 배열 선언
        let cart = [];

        // 배송비 나중에 수정 todo
        const FREE_SHIPPING_THRESHOLD = 30000;
        const SHIPPING_FEE = 3000;

        const emptyCartEl = document.getElementById('empty-cart');
        const cartContentEl = document.getElementById('cart-content');
        const cartItemsContainer = document.getElementById('cart-items-container');


        // 💡 1. 네비게이션 바를 타고 오자마자 백엔드 API(/api/carts/items)를 찔러 데이터 가져오기
        async function fetchMyCart() {
            try {
                const response = await fetch('/api/carts/items', { credentials: 'include' });

                // 🚨 인증 유효성 체크: 만약 쿠키가 없거나 문지기(JwtFilter)한테 쫓겨나면 로그인으로 리다이렉트
                if (response.status === 401) {
                    ui.toast('로그인이 필요한 서비스입니다.', 'error');
                    // 알림을 읽을 수 있도록 1.5초 뒤에 로그인 페이지로 리다이렉트
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                    return;
                }

                if (!response.ok) throw new Error('서버 데이터 로드 실패');
                const cartData = await response.json();
                // 🌟 중요: 백엔드에서 가져온 데이터에 강제로 selected = true 속성을 부여합니다.
                cart = cartData.map(item => ({ ...item, selected: true }));

                renderCart(); // 받아온 생생한 DB 데이터로 화면 렌더링 시작!
            } catch (error) {
                console.error('장바구니 로딩 중 에러 발생:', error);
                cart = [];
                renderCart();
                ui.toast('장바구니를 불러오지 못했습니다.', 'error');
            }
        }

        // function updateCartBadge() {
        //     const $badge = document.getElementById('cart-badge');
        //     if (!$badge) return;
        //     $badge.textContent = cart.length;
        //     $badge.classList.toggle('hidden', cart.length === 0);
        // }

        // 💡 3. 장바구니 렌더링 함수 (서버 DTO 규격에 맞게 필드명 매핑)
        function renderCart() {

            window.updateCartBadge(cart.reduce((sum, i) => sum + i.quantity, 0));

            if (cart.length === 0) {
                emptyCartEl.classList.remove('hidden');
                cartContentEl.classList.add('hidden');
                return;
            }

            emptyCartEl.classList.add('hidden');
            cartContentEl.classList.remove('hidden');

            let totalItems = 0;
            let totalPrice = 0;
            let selectedCount = 0;
            let cartHTML = '';

            cart.forEach(item => {

                if (item.selected) {
                    totalItems += item.quantity;
                    totalPrice += (item.finalPrice * item.quantity);
                    selectedCount++;
                }

                cartHTML += `
                <div class="flex gap-4 p-4 bg-white border border-gray-200 rounded-lg hover:border-gray-300 transition-colors shadow-sm">

                <input type="checkbox" onchange="toggleItem(${item.cartId}, this.checked)" ${item.selected ? 'checked' : ''} class="w-5 h-5 accent-[#447861] cursor-pointer flex-shrink-0 mt-2">
                    <a href="/products-detail/${item.productId}" class="flex-shrink-0 w-20 h-20 md:w-24 md:h-24 rounded-md overflow-hidden bg-gray-50 border border-gray-100">
                        <img src="${item.imageUrl}" alt="${item.name}" class="w-full h-full object-cover">
                    </a>
                    <div class="flex-1 flex flex-col justify-between min-w-0">
                        <div>
                            <a href="/products-detail/${item.productId}" class="text-sm font-medium text-gray-900 hover:text-[#3b4055] transition-colors line-clamp-2">
                                ${item.name}
                            </a>
                        </div>
                        <div class="flex items-center justify-between mt-2">
                            <div class="flex items-center gap-2">
                                <button onclick="updateQuantity(${item.cartId}, -1)" ${item.quantity <= 1 ? 'disabled' : ''} class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded text-gray-600 hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                                </button>
                                <span class="text-sm font-medium text-gray-800 w-6 text-center">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.cartId}, 1)" ${item.quantity >= 10 ? 'disabled' : ''} class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded text-gray-600 hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                </button>
                            </div>
                        <div class="flex items-center gap-3">
                            ${item.timeDeal ? `<span class="text-xs text-gray-400 line-through">${(item.basePrice * item.quantity).toLocaleString()}원</span>` : ``}
                            <span class="text-sm font-bold ${item.timeDeal ? 'text-[#447861]' : 'text-gray-900'}">${(item.finalPrice * item.quantity).toLocaleString()}원</span>
                            <button onclick="removeItem(${item.cartId})" class="w-7 h-7 flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        </div>
                    </div>
                </div>
                `;
            });

            cartItemsContainer.innerHTML = cartHTML;

            // 🌟 상단 '전체 선택' 체크박스 상태와 (선택개수/총개수) 텍스트 갱신
            const checkAllEl = document.getElementById('check-all');
            if (checkAllEl) checkAllEl.checked = (selectedCount === cart.length && cart.length > 0);

            const selectedCountEl = document.getElementById('selected-count');
            if (selectedCountEl) selectedCountEl.textContent = selectedCount;

            const totalCountEl = document.getElementById('total-count');
            if (totalCountEl) totalCountEl.textContent = cart.length;

            // 요약 영역 연산 로직 (동일)
            const shipping = totalPrice >= FREE_SHIPPING_THRESHOLD ? 0 : SHIPPING_FEE;
            const finalPrice = totalPrice + shipping;

            document.getElementById('total-items-text').textContent = `${totalItems}개의 상품이 담겨 있어요`;
            document.getElementById('summary-total-price').textContent = `${totalPrice.toLocaleString()}원`;
            document.getElementById('summary-shipping').textContent = shipping === 0 ? '무료' : `${shipping.toLocaleString()}원`;
            document.getElementById('summary-shipping').className = shipping === 0 ? 'text-[#3b4055] font-medium' : 'text-gray-800 font-medium';

            const freeShippingMsg = document.getElementById('free-shipping-msg');
            if (totalPrice < FREE_SHIPPING_THRESHOLD) {
                freeShippingMsg.classList.remove('hidden');
                document.getElementById('amount-needed').textContent = (FREE_SHIPPING_THRESHOLD - totalPrice).toLocaleString();
            } else {
                freeShippingMsg.classList.add('hidden');
            }

            document.getElementById('summary-final-price').textContent = `${finalPrice.toLocaleString()}원`;
            // 🌟 결제 버튼 활성/비활성 제어 로직 추가
            const checkoutBtn = document.getElementById('checkout-btn');
            const checkoutBtnText = document.getElementById('checkout-btn-text');

            if (checkoutBtn && checkoutBtnText) {
                if (selectedCount === 0) {
                    checkoutBtnText.textContent = '상품을 선택해주세요';
                    checkoutBtn.disabled = true;
                } else {
                    checkoutBtnText.textContent = `${finalPrice.toLocaleString()}원 결제하기`;
                    checkoutBtn.disabled = false;
                }
            }
        }

        // 💡 4. 수량 동적 변경 API 연동 (PATCH)
        window.updateQuantity = async function(cartId, delta) {
            const item = cart.find(i => i.cartId === cartId);
            if (!item) return;

            const targetQty = Math.max(1, Math.min(10, item.quantity + delta));
            if (item.quantity === targetQty) return;

            try {
                const response = await fetch(`/api/carts/${cartId}?quantity=${targetQty}`, {
                    method: 'PATCH',
                    credentials: 'include'
                });

                if (response.ok) {
                    item.quantity = targetQty;
                    renderCart();
                } else {
                    ui.toast('수량 수정에 실패했습니다.', 'error');
                }
            } catch (err) {
                console.error('수량 업데이트 네트워크 오류:', err);
                ui.toast('서버와의 통신에 실패했습니다.', 'error');
            }
        };

        // 💡 5. 장바구니 아이템 삭제 API 연동 (DELETE)
        window.removeItem = async function(cartId) {
            // 투박한 브라우저 알림창 대신 예쁜 커스텀 모달 띄우기
            ui.confirm('선택하신 상품을 장바구니에서 완전히 뺄까요?', async () => {
                try {
                    const response = await fetch(`/api/carts/${cartId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });

                    if (response.ok) {
                        cart = cart.filter(i => i.cartId !== cartId);
                        renderCart();
                        ui.toast('상품이 삭제되었습니다.');
                    } else {
                        ui.toast('상품 제거에 실패했습니다.', 'error');
                    }
                } catch (err) {
                    console.error('삭제 처리 네트워크 오류:', err);
                    ui.toast('서버와의 통신에 실패했습니다.', 'error');
                }
            });
        };

        // 🌟 새로 추가: 전체 선택 토글
        window.toggleAll = function(checked) {
            cart = cart.map(item => ({ ...item, selected: checked }));
            renderCart();
        };

        // 🌟 새로 추가: 개별 선택 토글
        window.toggleItem = function(cartId, checked) {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                item.selected = checked;
                renderCart();
            }
        };

        // 🌟 새로 추가: 선택 삭제 (다중 삭제 API가 없다고 가정하고 개별 삭제 API를 병렬 요청)
        window.removeSelected = async function() {
            const selectedItems = cart.filter(item => item.selected);
            if (selectedItems.length === 0) {
                ui.toast('삭제할 상품을 선택해주세요.', 'error');
                return;
            }

            ui.confirm(`선택하신 ${selectedItems.length}개의 상품을 삭제할까요?`, async () => {
                try {
                    // 선택된 아이템들을 순회하며 삭제 API를 동시 호출합니다.
                    const promises = selectedItems.map(item =>
                        fetch(`/api/carts/${item.cartId}`, { method: 'DELETE', credentials: 'include' })
                    );

                    const results = await Promise.all(promises);
                    const allSuccess = results.every(res => res.ok);

                    if (allSuccess) {
                        // 성공적으로 지워진 아이템들만 로컬 상태에서 제거
                        cart = cart.filter(item => !item.selected);
                        renderCart();
                        ui.toast('선택하신 상품이 삭제되었습니다.');
                    } else {
                        ui.toast('일부 상품 삭제에 실패했습니다.', 'error');
                        // fetchMyCart(); // 꼬인 상태를 방지하기 위해 서버에서 다시 불러옴
                    }
                } catch (err) {
                    console.error('선택 삭제 오류:', err);
                    ui.toast('서버와의 통신에 실패했습니다.', 'error');
                }
            });
        };

        window.handleCheckout = function() {
            window.location.href = '/orders';
        };

        // // --- 실시간 알림 애니메이션 배너 로직 ---
        // const viewerCountEl = document.getElementById('viewer-count');
        // let currentViewers = 42;
        // setInterval(() => {
        //     const change = Math.floor(Math.random() * 9) - 4;
        //     currentViewers = Math.max(12, Math.min(180, currentViewers + change));
        //     if(viewerCountEl) viewerCountEl.textContent = `${currentViewers}명`;
        // }, 3000 + Math.floor(Math.random() * 3000));


        const countdownTextEl = document.getElementById('countdown-text');
        const countdownBanner = document.getElementById('countdown-banner');

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        setInterval(() => {
            const now = new Date();

            // 오늘 새벽배송 마감 (당일 23:00)
            const cutoff = new Date(now);
            cutoff.setHours(23, 0, 0, 0);

            // 이미 오늘 마감(23:00)을 넘겼으면 → 다음날 23:00을 목표로
            const pastTodayCutoff = now.getTime() >= cutoff.getTime();
            if (pastTodayCutoff) {
                cutoff.setDate(cutoff.getDate() + 1);
            }


            const timeLeft = cutoff.getTime() - now.getTime();
            const isUrgent = timeLeft < 2 * 60 * 60 * 1000;
            const timeStr = formatTime(timeLeft);

            if (countdownTextEl && countdownBanner) {
                if (isUrgent) {
                    countdownBanner.className = 'flex items-center gap-2 px-3 py-2 rounded-lg border w-fit bg-[#447861]/10 border-[#447861]/20 text-[#447861]';
                    countdownBanner.querySelector('svg').classList.replace('text-[#3b4055]', 'text-[#447861]');
                    countdownTextEl.innerHTML = `오늘의 새벽배송 마감 임박! <strong class="font-bold text-[#396652]">${timeStr}</strong> 후 마감`;
                } else {
                    countdownBanner.className = 'flex items-center gap-2 px-3 py-2 rounded-lg border w-fit bg-[#3b4055]/10 border-[#3b4055]/15';
                    // 마감 후 다시 non-urgent로 돌아올 때 아이콘 색 복구
                    countdownBanner.querySelector('svg').classList.replace('text-[#447861]', 'text-[#3b4055]');

                    // 마감을 넘긴 뒤에는 다음 회차 기준으로 안내
                    const cutoffLabel = pastTodayCutoff ? '내일 밤 11시' : '오늘 밤 11시';
                    const arrivalLabel = pastTodayCutoff ? '모레 아침 7시' : '내일 아침 7시';
                    countdownTextEl.innerHTML = `${cutoffLabel}까지 주문 시 <strong class="font-bold text-gray-900">${timeStr}</strong> 남음 — ${arrivalLabel} 전 도착`;
                }
            }
        }, 1000);

        // 🚀 핵심 포인트: 장바구니 페이지 로드 즉시 비동기 함수 실행!
        fetchMyCart();
    });
</script>
