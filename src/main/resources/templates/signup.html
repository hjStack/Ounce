<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='회원가입')}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">r
</head>
<body class="bg-background-100 min-h-screen flex flex-col">

<div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

        <!-- 로고 -->
        <div class="text-center mb-8">
            <!-- 내비바 워드마크와 같은 색으로 통일 (이 페이지엔 내비바가 없어 여기가 워드마크 역할) -->
            <a href="/" class="font-heading text-4xl text-foreground-950">Ounce</a>
            <p class="text-sm text-foreground-500 mt-2">한 사람을 위한 완벽한 한 끼</p>
        </div>


        <!-- 가입 혜택 안내. 테라코타(deal)는 미드나이트 세일 전용이라 여기엔 쓰지 않는다 —
             세일이 아닌 곳에 세일 색을 쓰면 실제 세일이 눈에 안 들어온다. -->
        <div class="flex items-center gap-2.5 px-4 py-3 mb-6 rounded-lg bg-primary-50 border border-primary-100">
            <i class="ri-gift-line text-lg text-primary-600"></i>
            <span class="text-sm font-medium text-primary-700">지금 가입하면 축하 포인트 1,000P를 드려요 🎁</span>
        </div>

        <!-- 카드 -->
        <div class="bg-white rounded-2xl border border-background-200 shadow-sm p-8 md:p-10">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-foreground-950">회원가입</h2>
                <p class="text-sm text-foreground-500 mt-1">Ounce의 회원이 되어 특별한 혜택을 받아보세요</p>
            </div>

            <form id="signupForm" class="flex flex-col gap-5" method="post" novalidate>
                <div>
                    <label class="block text-sm font-medium text-foreground-700 mb-1.5">이름</label>
                    <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required
                           class="w-full px-4 py-3 rounded-lg border border-background-200 bg-background-50 text-foreground-900
                                  placeholder-foreground-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-100
                                  focus:outline-none transition-colors"/>
                    <div id="nameError" class="text-xs text-red-500 mt-1"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-foreground-700 mb-1.5">이메일</label>
                    <input type="email" id="email" placeholder="이메일 (예: example@ounce.com)을 입력하세요" required
                           class="w-full px-4 py-3 rounded-lg border border-background-200 bg-background-50 text-foreground-900
                                  placeholder-foreground-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-100
                                  focus:outline-none transition-colors"/>
                    <div id="emailError" class="text-xs text-red-500 mt-1"></div>
                </div>

                <div>
                <label class="block text-sm font-medium text-foreground-700 mb-1.5">비밀번호</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="8자 이상 입력하세요" required
                           class="w-full px-4 py-3 pr-12 rounded-lg border border-background-200 bg-background-50 text-foreground-900
                      placeholder-foreground-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-100
                      focus:outline-none transition-colors"/>
                    <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2
                text-foreground-400 hover:text-foreground-600 transition-colors" aria-label="비밀번호 표시">
                        <i class="ri-eye-line text-lg"></i>
                    </button>
                </div>
                <div id="passwordError" class="text-xs text-red-500 mt-1"></div>
            </div>

                <div>
                    <label class="block text-sm font-medium text-foreground-700 mb-1.5">비밀번호 확인</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required
                               class="w-full px-4 py-3 pr-12 rounded-lg border border-background-200 bg-background-50 text-foreground-900
                      placeholder-foreground-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-100
                      focus:outline-none transition-colors"/>
                        <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2
                text-foreground-400 hover:text-foreground-600 transition-colors" aria-label="비밀번호 표시">
                            <i class="ri-eye-line text-lg"></i>
                        </button>
                    </div>
                    <div id="confirmPasswordError" class="text-xs text-red-500 mt-1"></div>
                </div>

                <button type="submit"
                        class="w-full py-3.5 mt-2 bg-ink-500 hover:bg-ink-600 text-white font-medium
                               rounded-lg transition-colors">
                    회원가입
                </button>
            </form>

            <!-- 구분선 -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-background-200"></div>
                <span class="text-xs text-foreground-400">또는</span>
                <div class="flex-1 h-px bg-background-200"></div>
            </div>

            <!-- 소셜 로그인 -->
            <button type="button" onclick="location.href='/oauth2/authorization/google'"
                    class="w-full py-3 flex items-center justify-center gap-2 border border-background-200
                           rounded-lg hover:bg-background-50 transition-colors text-sm font-medium text-foreground-700">
                <i class="ri-google-fill text-base"></i> Google로 계속하기
            </button>

            <!-- 하단 -->
            <div class="text-center mt-6">
                <p class="text-sm text-foreground-500">
                    이미 계정이 있으신가요?
                    <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">로그인</a>
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/signup.js"></script>
</body>
</html>
