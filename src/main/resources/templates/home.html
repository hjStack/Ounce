<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Ounce')}"></head>
<body class="bg-white">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="pt-20 md:pt-24">
    <div class="flex items-center justify-center text-center px-6 py-16 md:py-20">
        <div>
            <h1 class="text-4xl md:text-5xl font-semibold font-heading italic mb-4">Ounce</h1>
            <p class="text-gray-500">당신의 아침을 디자인합니다.</p>
        </div>
    </div>

    <section class="w-full px-4 md:px-8 lg:px-12 pb-16 max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl md:text-2xl font-bold font-heading text-foreground-950">지금 만나보세요</h2>
            <a href="/products" class="px-4 py-2 text-sm font-medium text-foreground-700 border border-background-300 rounded-md hover:bg-background-100 transition-colors whitespace-nowrap">
                전체 상품 보기
            </a>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="py-16 text-center text-foreground-500 text-sm">
            아직 등록된 상품이 없습니다.
        </div>

        <div th:unless="${#lists.isEmpty(products)}" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <div th:each="product : ${products}" th:replace="~{fragments/product-card :: productCard(${product})}"></div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
