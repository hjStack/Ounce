<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${mode == 'login'} ? '로그인 - Ounce' : '회원가입 - Ounce')}"></head>
<body class="bg-white">

<div class="min-h-screen bg-background-50 flex">
    <!-- Left side image - desktop only -->
    <div class="hidden lg:flex lg:w-[45%] xl:w-[40%] relative">
        <img src="https://placehold.co/800x1000?text=Ounce" alt="신선한 식품" class="w-full h-full object-cover"/>
        <div class="absolute inset-0 bg-gradient-to-r from-transparent to-background-50/20"></div>
        <div class="absolute bottom-12 left-12 right-12">
            <a href="/" class="text-3xl font-bold font-heading text-white mb-3 block">Ounce<span class="text-primary-300">.</span></a>
            <p class="text-white/80 text-sm leading-relaxed">
                매일 아침 신선하게 도착하는<br/>
                프리미엄 신선식품 쇼핑몰
            </p>
        </div>
    </div>

    <!-- Right side form -->
    <div class="flex-1 flex flex-col items-center justify-center px-4 md:px-8 py-12 lg:py-0">
        <div class="lg:hidden mb-8 text-center">
            <a href="/" class="text-2xl font-bold font-heading text-foreground-950">Ounce<span class="text-primary-500">.</span></a>
        </div>

        <div th:replace="~{fragments/auth-form :: authForm(${mode})}"></div>
    </div>
</div>

</body>
</html>
