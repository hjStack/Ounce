services:
  ounce-db:
    image: mysql:8.0
    container_name: ounce-db
    environment:
      MYSQL_ROOT_PASSWORD: Mickey51799@@
      MYSQL_DATABASE: Ounce
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-pMickey51799@@"]
      interval: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

  app-blue:
    image: ${DOCKER_USERNAME}/ounce-api:latest
    container_name: app-blue
    ports:
      - "8080:8080"
    depends_on:
      ounce-db:
        condition: service_healthy
    restart: always

  app-green:
    image: ${DOCKER_USERNAME}/ounce-api:latest
    container_name: app-green
    ports:
      - "8081:8080"
    depends_on:
      ounce-db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ounce-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    restart: always

volumes:
  db_data: