services:
  ounce-db:
    image: mysql:8.0
    container_name: ounce-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Mickey51799@@
      MYSQL_DATABASE: Ounce
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-pMickey51799@@"]
      interval: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
  redis-server:
    image: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10



  app-blue:
    image: hyejun02/ounce-api:latest
    container_name: app-blue
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ounce-db
    depends_on:
      ounce-db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ounce-nginx
    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
# // EC2에 있는 파일(왼쪽)과 도커 안에 있는 파일(오른쪽)을 마치 거울처럼 실시간으로 똑같이 맞춰라!(볼륨 마운트)"라는 뜻입니다.
    restart: always

volumes:
  db_data: