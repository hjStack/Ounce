services:
  ounce-db:
    image: mysql:8.0
    container_name: ounce-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: Ounce
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    container_name: ounce-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes   # 재시작 시 데이터 유지
    volumes:
      - redis-data:/data
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.es
    image: ounce-elasticsearch:9.4.3
    container_name: ounce-es
    environment:
      - node.name=ounce-es
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kibana:
      image: docker.elastic.co/kibana/kibana:9.4.3
      container_name: ounce-kibana
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      ports:
        - "5601:5601"
      depends_on:
        elasticsearch:
          condition: service_healthy
      restart: unless-stopped

  app-blue:
    image: hyejun02/ounce-api:latest
    container_name: app-blue
    ports:
      - "8080:8080"
    environment:
      # 운영 기본값. application-prod.yml 에만 server.shutdown: graceful 과
      # spring.lifecycle.timeout-per-shutdown-phase 가 있어서, 이게 local 이면
      # 무중단 배포의 graceful shutdown 이 꺼집니다 (jar 안에 application-local.yml 은 없음).
      # 로컬 개발은 docker-compose.local.yml 이 local 로 덮습니다.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://ounce-db:3306/Ounce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      DB_HOST: ounce-db
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      ounce-db:
        condition: service_healthy
    restart: always

  app-green:
    image: hyejun02/ounce-api:latest
    container_name: app-green
    ports:
      - "8081:8080"
    environment:
      # 운영 기본값. application-prod.yml 에만 server.shutdown: graceful 과
      # spring.lifecycle.timeout-per-shutdown-phase 가 있어서, 이게 local 이면
      # 무중단 배포의 graceful shutdown 이 꺼집니다 (jar 안에 application-local.yml 은 없음).
      # 로컬 개발은 docker-compose.local.yml 이 local 로 덮습니다.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://ounce-db:3306/Ounce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      DB_HOST: ounce-db
      JWT_SECRET: ${JWT_SECRET}
      # 구글 OAuth. 이 두 줄이 없으면 application.yml 의 ${GOOGLE_CLIENT_ID} 가
      # 치환되지 않고 리터럴 문자열로 구글에 전달돼 invalid_client 로 로그인이 실패합니다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      ounce-db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ounce-nginx
    ports:
      - "80:80"
      - "443:443"

    volumes:
      # 운영 설정은 nginx.prod.conf 입니다.
      # nginx/nginx.conf 는 로컬용(80 포트, TLS 없음)이라 서버에 마운트하면 HTTPS 가 날아갑니다.
      # 로컬에서 nginx 를 띄울 때는 docker-compose.local.yml 이 이 마운트를 되돌립니다.
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      # certbot 인증서. 이게 없으면 443 서버 블록이 기동 실패합니다.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot renew 용 ACME 챌린지 경로 (nginx.prod.conf 의 /.well-known/acme-challenge/).
      - ./certbot-webroot:/var/www/certbot
    restart: always

volumes:
  db_data:
  redis-data:
  es-data:
