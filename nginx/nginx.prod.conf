# ─────────────────────────────────────────────────────────────
# 운영 서버(EC2) 전용 nginx 설정.
# /home/ubuntu/ounce/nginx/nginx.conf 에 이 내용을 그대로 넣습니다.
#
# 레포의 nginx/nginx.conf 는 로컬용(80 포트, TLS 없음)이라 서로 다릅니다.
# 절대 로컬용 파일을 서버에 덮어쓰지 마세요. HTTPS 가 날아갑니다.
# ─────────────────────────────────────────────────────────────

events { worker_connections 1024; }

# [추가] reload 이후 남는 예전 워커 프로세스의 수명 상한.
# 이게 없으면(기본값 무제한) 옛 워커가 계속 구버전 컨테이너로 요청을 보내고,
# 배포 스크립트가 구버전을 내리는 순간 그 요청들이 전부 502 가 됩니다.
# deploy.sh 의 DRAIN_SECONDS 는 반드시 이 값보다 커야 합니다.
# ※ 이 지시어는 -s reload 로 적용되지 않습니다. nginx 컨테이너 restart 필요.
worker_shutdown_timeout 20s;

http {
    # [수정] ipv6=off 추가.
    # 도커 내장 DNS 의 AAAA 응답 때문에 이름 해석이 간헐적으로 실패해
    # 502 가 튀는 전형적인 패턴을 막습니다. valid 도 5s → 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # [추가] 클라이언트 keep-alive 를 짧게 잡아
    # 색 전환 시 잔여 커넥션이 빨리 정리되게 합니다.
    keepalive_timeout 30s;

    server {
        listen 80;
        server_name ouncefresh.com www.ouncefresh.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name ouncefresh.com www.ouncefresh.com;

        ssl_certificate     /etc/letsencrypt/live/ouncefresh.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ouncefresh.com/privkey.pem;

        location / {
            # 현재 서비스 중인 색(app-blue / app-green)을 여기서 읽어옵니다.
            # deploy.sh 가 이 파일을 덮어쓰고 reload 하는 방식으로 전환합니다.
            include /etc/nginx/conf.d/service-env.inc;

            # 변수를 쓰기 때문에 요청 시점에 resolver 로 이름을 풉니다.
            # upstream 블록을 쓰면 설정 로드 시점에 해석하므로, 해당 컨테이너가
            # 내려가 있을 때 nginx 자체가 기동 실패합니다. 그래서 변수 방식 유지.
            proxy_pass http://$service_url;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # [추가] 죽은 백엔드에 오래 매달리지 않게.
            proxy_connect_timeout 3s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
