events { worker_connections 1024; }

# reload 이후 남아있는 예전 워커 프로세스를 최대 20초까지만 살려둡니다.
# 이 값이 없으면(기본값 = 무제한) 옛 워커가 계속 구버전 컨테이너로 요청을 보내고,
# 배포 스크립트가 구버전을 내리는 순간 그 요청들이 502 가 됩니다.
# deploy.sh 의 DRAIN_SECONDS 는 반드시 이 값보다 커야 합니다.
worker_shutdown_timeout 20s;

http {
    # 도커 컨테이너 이름(app-blue / app-green)을 찾기 위한 내장 DNS.
    # ipv6=off 필수: 도커 DNS 의 AAAA 응답 때문에 간헐적으로 이름 해석에 실패해
    #               502 가 튀는 사례가 흔합니다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # 클라이언트 keep-alive 를 짧게 잡아 전환 시 잔여 커넥션이 빨리 정리되게 합니다.
    keepalive_timeout 30s;

    server {
        # 사용자는 무조건 80번 포트(기본 HTTP)로 접속합니다.
        listen 80;

        location / {
            # 아래 파일에서 현재 떠있는 서버($service_url)가 app-blue인지 app-green인지 읽어옵니다.
            include /etc/nginx/conf.d/service-env.inc;

            # 🌟 리버스 프록시 🌟
            # 변수를 쓰기 때문에 요청 시점에 resolver 로 이름을 풉니다.
            # (upstream 블록을 쓰면 설정 로드 시점에 해석해서, 해당 컨테이너가
            #  내려가 있으면 nginx 자체가 기동 실패합니다. 그래서 일부러 변수 방식 유지.)
            proxy_pass http://$service_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
