name: 1인 가구를 위한 Ounce 배포

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v3

      - name: ☕ JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🛡️ application.yml 파일 만들기
        env:
          APP_YML: ${{ secrets.APPLICATION_YML }}
        run: |
          mkdir -p src/main/resources
          printf '%s' "$APP_YML" > src/main/resources/application.yml

      - name: 프로젝트 빌드 (Maven)
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: 🐳 도커 허브 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest

      - name: 📦 운영 배포 파일 준비
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          DEPLOY_DIR="/home/ubuntu/ounce"

          mkdir -p "$DEPLOY_DIR/nginx"
          cp docker-compose.yml deploy.sh "$DEPLOY_DIR/"
          cp nginx/nginx.prod.conf "$DEPLOY_DIR/nginx/"

      - name: 🌐 EC2 로컬 무중단 배포 실행
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          DEPLOY_DIR="/home/ubuntu/ounce"

          cd "$DEPLOY_DIR"
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest
          chmod +x ./deploy.sh
          ./deploy.sh
