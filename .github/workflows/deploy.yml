
name: 1인 가구를 위한 Ounce 배포

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: ["main"]

# 하나의 workflows는 1개 이상의 job으로 구성
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

 # steps : 특정 작업을 수행하는 가장 작은 단위
    steps:
      # 1. 깃허브 저장소에 있는 최신 코드를 로봇의 작업 공간으로 가져오기
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v3

      # 2. 자바 21 세팅 (로그에서 확인한 버전 반영!)
      - name: ☕ JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. application.yml 파일 생성 (보안 유지!)
      # DB 비밀번호 같은 민감한 정보는 깃허브에 올리면 안 되므로, GitHub Secrets에 숨겨두고 빌드할 때만 몰래 주입합니다.
      - name: 🛡️ application.yml 파일 만들기
        env:
          APP_YML: ${{ secrets.APPLICATION_YML }}
        run: |
          mkdir -p src/main/resources
          printf '%s' "$APP_YML" > src/main/resources/application.yml

#      - name: application-prod.yml 생성
#        run: |
#          echo "${{ secrets.APPLICATION_PROD_YML }}" > src/main/resources/application-prod.yml

      # 4. 메이븐(Maven)으로 프로젝트 빌드 (.jar 파일 생성)
      - name: 프로젝트 빌드 (Maven)
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 5. 도커 허브(Docker Hub) 로그인
      - name: 🐳 도커 허브 로그인

        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. 도커 이미지 빌드 및 도커 허브로 업로드(Push)
      - name: 🚀 도커 이미지 빌드 및 푸시

        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest

      # 7. 설정 파일을 운영 서버로 전송
      #
      # 서버에서 git pull 을 하지 않는 이유: 이 레포는 private 이고 서버에는
      # GitHub 자격증명이 없습니다(credential helper·.git-credentials·SSH 키 전부 없음).
      # 러너는 이미 이 커밋을 체크아웃한 상태이므로, 서버가 당겨오는 대신 러너가 밀어넣습니다.
      # 이렇게 하면 서버에 새 비밀키를 심지 않아도 레포가 유일한 설정 소스가 됩니다.
      #
      # ⚠️ nginx/conf.d/ 는 일부러 제외합니다.
      #    그 안의 service-env.inc 는 설정이 아니라 "지금 어느 색이 서비스 중인지"라는
      #    런타임 상태입니다. 배포마다 덮어쓰면 deploy.sh 의 색 판별이 실제와 어긋나서,
      #    트래픽을 받고 있는 컨테이너를 재생성하는 다운타임이 발생합니다.
      - name: 📦 설정 파일 운영 서버로 전송
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # nginx.prod.conf 가 운영 nginx 설정입니다. nginx/nginx.conf 는 로컬용(TLS 없음)이라
          # 서버에 보내면 안 됩니다.
          source: "docker-compose.yml,deploy.sh,nginx/nginx.prod.conf"
          target: /home/${{ secrets.SERVER_USERNAME }}/ounce

      # 8. 운영 서버에 접속해서 무중단 배포 스크립트 실행
      - name: 🌐 운영 서버 접속 및 무중단 배포 실행
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USERNAME }}/ounce
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest
            chmod +x ./deploy.sh
            ./deploy.sh
